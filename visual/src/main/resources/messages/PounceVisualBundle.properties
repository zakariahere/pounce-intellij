inlay.for.name=Pounce: for-comprehension effects
inlay.for.description=Shows the effect of a for-comprehension on <code>for</code> (with the typeclass bounds in scope for tagless code), and the effect and bound value type after each generator, e.g. <code>user &lt;- findUser(id)</code> &#9656; <code>IO &middot; User</code>. A step in a different effect is marked with <code>&ne;</code>. Also requires Settings | Languages &amp; Frameworks | Pounce | For-comprehension hints.
inlay.instances.name=Pounce: typeclass instances of cats calls
inlay.instances.description=After a cats syntax call, shows the typeclass instances it uses, e.g. <code>ids.traverse(findUser)</code> &#9656; <code>Traverse[List] &middot; Applicative[IO]</code>. Click an instance to navigate to it. Off by default: enable Settings | Languages &amp; Frameworks | Pounce | Instance hints.
