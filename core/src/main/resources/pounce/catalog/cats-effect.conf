# Cats Effect 3: IO constructors & methods, tagless-final syntax, Ref / Deferred / Resource.
library = cats-effect
kind = companion

ops = [
  # ---------------------------------------------------------------- IO constructors
  { name = pure, owner = IO, params = ["A"], result = "IO[A]", rank = 80
    doc = "Lift an already computed value. Never use for side effects: use IO(...) / IO.delay."
    see-also = [delay, unit] }
  { name = delay, owner = IO, params = ["A"], result = "IO[A]", rank = 75, insert = "delay(|)"
    doc = "Suspend a synchronous, non-blocking side effect. Same as IO(...)."
    see-also = [blocking, interruptible] }
  { name = blocking, owner = IO, params = ["A"], result = "IO[A]", rank = 80, insert = "blocking(|)"
    doc = "Suspend a blocking side effect (JDBC, file IO, Thread.sleep) on the blocking pool so it does not starve the compute pool."
    example = "IO.blocking(Files.readString(path))"
    see-also = [interruptible, delay] }
  { name = interruptible, owner = IO, params = ["A"], result = "IO[A]", rank = 50, insert = "interruptible(|)"
    doc = "Like blocking, but cancellation interrupts the thread." }
  { name = raiseError, owner = IO, params = ["Throwable"], result = "IO[A]", rank = 70
    doc = "A failed IO." }
  { name = unit, owner = IO, result = "IO[Unit]", rank = 70, insert = "unit"
    doc = "An IO that does nothing. Preferred over IO.pure(())." }
  { name = sleep, owner = IO, params = ["FiniteDuration"], result = "IO[Unit]", rank = 65
    doc = "Semantically block for a duration, without blocking a thread. Never use Thread.sleep inside IO."
    example = "IO.sleep(500.millis)" }
  { name = defer, owner = IO, params = ["IO[A]"], result = "IO[A]", rank = 40
    doc = "Suspend the construction of an IO (stack safety, laziness)." }
  { name = fromFuture, owner = IO, params = ["IO[Future[A]]"], result = "IO[A]", rank = 60
    doc = "Convert a Future. The Future must be created inside the IO argument, otherwise it is already running."
    example = "IO.fromFuture(IO(client.call()))" }
  { name = fromEither, owner = IO, params = ["Either[Throwable, A]"], result = "IO[A]", rank = 55
    doc = "Lift an Either with a Throwable on the left." }
  { name = fromOption, owner = IO, params = ["Option[A]", "Throwable"], result = "IO[A]", rank = 55, insert = "fromOption(|)()"
    doc = "Lift an Option, failing with the given error for None." }
  { name = ref, owner = IO, params = ["A"], result = "IO[Ref[IO, A]]", rank = 55
    doc = "Create a Ref (concurrent mutable variable)." }
  { name = deferred, owner = IO, result = "IO[Deferred[IO, A]]", rank = 40, insert = "deferred[|]"
    doc = "Create a Deferred (a one-shot promise)." }
  { name = println, owner = IO, params = ["A"], result = "IO[Unit]", rank = 50
    doc = "Print a line as an effect." }
  { name = race, owner = IO, params = ["IO[A]", "IO[B]"], result = "IO[Either[A, B]]", rank = 45, insert = "race(|, )"
    doc = "Run both, return the first to finish and cancel the loser." }
  { name = both, owner = IO, params = ["IO[A]", "IO[B]"], result = "IO[(A, B)]", rank = 45, insert = "both(|, )"
    doc = "Run both in parallel, return both results." }
  { name = parTraverseN, owner = IO, params = ["Int", "List[A]", "A => IO[B]"], result = "IO[List[B]]", rank = 50, insert = "parTraverseN(|)()()"
    doc = "parTraverse with at most n effects running at once." }
  { name = whenA, owner = IO, params = ["Boolean", "IO[Unit]"], result = "IO[Unit]", rank = 40, insert = "whenA(|)()"
    doc = "Run the effect only if the condition holds." }
  { name = cede, owner = IO, result = "IO[Unit]", rank = 20, insert = "cede"
    doc = "Yield control to other fibers (fairness in long CPU loops)." }
  { name = realTime, owner = IO, result = "IO[FiniteDuration]", rank = 35, insert = "realTime"
    doc = "Wall-clock time since epoch." }
  { name = monotonic, owner = IO, result = "IO[FiniteDuration]", rank = 35, insert = "monotonic"
    doc = "Monotonic time, for measuring durations." }

  # ---------------------------------------------------------------- IO methods (docs, explorer, finder)
  { name = attempt, owner = IO, kind = method, receiver = "IO[A]", result = "IO[Either[Throwable, A]]", rank = 70, insert = "attempt"
    doc = "Materialise errors into an Either." }
  { name = start, owner = IO, kind = method, receiver = "IO[A]", result = "IO[Fiber[IO, Throwable, A]]", rank = 55, insert = "start"
    doc = "Start a fiber. You must join or cancel it, otherwise it leaks: prefer background or Supervisor."
    see-also = [background] }
  { name = background, owner = IO, kind = method, receiver = "IO[A]", result = "Resource[IO, IO[Outcome[IO, Throwable, A]]]", rank = 55, insert = "background"
    doc = "Start a fiber scoped to a Resource: cancelled automatically when the resource is released." }
  { name = timeout, owner = IO, kind = method, receiver = "IO[A]", params = ["FiniteDuration"], result = "IO[A]", rank = 60
    doc = "Fail with TimeoutException if not done in time." }
  { name = guarantee, owner = IO, kind = method, receiver = "IO[A]", params = ["IO[Unit]"], result = "IO[A]", rank = 50
    doc = "Run a finalizer on success, error or cancellation." }
  { name = memoize, owner = IO, kind = method, receiver = "IO[A]", result = "IO[IO[A]]", rank = 35, insert = "memoize"
    doc = "Cache the result: the inner IO runs the effect at most once." }
  { name = unsafeRunSync, owner = IO, kind = method, receiver = "IO[A]", result = "A", rank = 10, insert = "unsafeRunSync()"
    doc = "Run the IO, blocking the current thread. Only at the edge of the world (main, tests)." }
  { name = unsafeToFuture, owner = IO, kind = method, receiver = "IO[A]", result = "Future[A]", rank = 10, insert = "unsafeToFuture()"
    doc = "Run the IO and expose it as a Future. The legitimate bridge in Play 3 Action.async bodies." }

  # ---------------------------------------------------------------- tagless-final summoners
  { name = delay, owner = Sync, params = ["A"], result = "F[A]", rank = 80, insert = "delay(|)"
    doc = "Sync[F].delay: suspend a synchronous side effect in F." }
  { name = blocking, owner = Sync, params = ["A"], result = "F[A]", rank = 80, insert = "blocking(|)"
    doc = "Sync[F].blocking: suspend a blocking side effect on the blocking pool." }
  { name = interruptible, owner = Sync, params = ["A"], result = "F[A]", rank = 40, insert = "interruptible(|)"
    doc = "Sync[F].interruptible: blocking, interruptible on cancellation." }
  { name = defer, owner = Sync, params = ["F[A]"], result = "F[A]", rank = 40
    doc = "Sync[F].defer: suspend construction of an F." }
  { name = fromFuture, owner = Async, params = ["F[Future[A]]"], result = "F[A]", rank = 55
    doc = "Async[F].fromFuture: convert a Future created inside the F argument." }
  { name = sleep, owner = Temporal, params = ["FiniteDuration"], result = "F[Unit]", rank = 55
    doc = "Temporal[F].sleep: semantic sleep." }
  { name = ref, owner = Concurrent, params = ["A"], result = "F[Ref[F, A]]", rank = 50
    doc = "Concurrent[F].ref: create a Ref." }

  # ---------------------------------------------------------------- Ref / Deferred / Resource
  { name = of, owner = Ref, params = ["A"], result = "F[Ref[F, A]]", rank = 70, insert = "of[|](  )"
    doc = "Create a Ref with an initial value."
    example = "Ref.of[IO, Int](0)" }
  { name = make, owner = Resource, params = ["F[A]", "A => F[Unit]"], result = "Resource[F, A]", rank = 85, insert = "make(|)(a => )"
    doc = "Acquire / release pair. Release runs even on error or cancellation."
    example = "Resource.make(IO(openConn()))(c => IO(c.close()))" }
  { name = eval, owner = Resource, params = ["F[A]"], result = "Resource[F, A]", rank = 70
    doc = "Lift an effect into Resource (no finalizer)." }
  { name = pure, owner = Resource, params = ["A"], result = "Resource[F, A]", rank = 50
    doc = "A Resource of an already available value." }
  { name = fromAutoCloseable, owner = Resource, params = ["F[A]"], result = "Resource[F, A]", rank = 60
    doc = "Resource from a java.lang.AutoCloseable, closed on release." }
  { name = use, owner = Resource, kind = method, receiver = "Resource[F, A]", params = ["A => F[B]"], result = "F[B]", rank = 80
    doc = "Acquire, use, release. The result must not leak the resource out of the scope." }
  { name = evalMap, owner = Resource, kind = method, receiver = "Resource[F, A]", params = ["A => F[B]"], result = "Resource[F, B]", rank = 50
    doc = "Run an effect on the acquired value." }
  { name = allocated, owner = Resource, kind = method, receiver = "Resource[F, A]", result = "F[(A, F[Unit])]", rank = 10, insert = "allocated"
    doc = "Low-level: acquire and return the release action. You must call release yourself, prefer use." }

  # ---------------------------------------------------------------- tagless-final syntax (cats.effect.syntax)
  { name = start, owner = Spawn, kind = syntax, syntax = effect.spawn, receiver = "F[A]", result = "F[Fiber[F, Throwable, A]]"
    requires { F = Spawn }, rank = 50, insert = "start"
    doc = "Start a fiber; join or cancel it (prefer background)." }
  { name = background, owner = Spawn, kind = syntax, syntax = effect.spawn, receiver = "F[A]", result = "Resource[F, F[Outcome[F, Throwable, A]]]"
    requires { F = Spawn }, rank = 50, insert = "background"
    doc = "Start a fiber scoped to a Resource." }
  { name = timeout, owner = Temporal, kind = syntax, syntax = effect.temporal, receiver = "F[A]", params = ["FiniteDuration"], result = "F[A]"
    requires { F = Temporal }, rank = 55
    doc = "Fail with TimeoutException if not completed in time." }
  { name = parTraverseN, owner = Concurrent, kind = syntax, syntax = effect.concurrent, receiver = "T[A]", params = ["Int"], result = "F[T[B]]"
    requires { T = Traverse, F = Concurrent }, rank = 55, insert = "parTraverseN(|)()"
    doc = "parTraverse with bounded parallelism." }
  { name = guarantee, owner = MonadCancel, kind = syntax, syntax = effect.monadCancel, receiver = "F[A]", params = ["F[Unit]"], result = "F[A]"
    requires { F = MonadCancel }, rank = 45
    doc = "Run a finalizer on success, error or cancellation." }
]
