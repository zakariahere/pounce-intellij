# Cats Effect 3 (3.5 / 3.6): more IO constructors and methods, kernel summoners (Sync[F]., Spawn[F]., ...),
# cats.effect.syntax extensions for tagless F[_], Resource / Ref / Deferred / Fiber.
# Methods that share a name with a companion op of the same owner use `variant = method`; summoner members that share
# a name with a syntax op use `variant = summoner`.
library = cats-effect
kind = companion

ops = [
  # ---------------------------------------------------------------- IO constructors
  { name = async_, owner = IO, params = ["(Either[Throwable, A] => Unit) => Unit"], result = "IO[A]", rank = 35, insert = "async_(cb => |)"
    doc = "Wrap a callback-based API. Not cancelable: use IO.async when the API can be cancelled."
    example = "IO.async_[Int](cb => client.get(k, r => cb(Right(r))))" }
  { name = async, owner = IO, params = ["(Either[Throwable, A] => Unit) => IO[Option[IO[Unit]]]"], result = "IO[A]", rank = 25, insert = "async(cb => |)"
    doc = "Wrap a callback-based API with a cancellation finalizer (return Some(cancelAction))." }
  { name = never, owner = IO, result = "IO[Nothing]", rank = 15, insert = "never"
    doc = "An IO that never completes (until cancelled)." }
  { name = canceled, owner = IO, result = "IO[Unit]", rank = 10, insert = "canceled"
    doc = "Request self-cancellation of the current fiber." }
  { name = uncancelable, owner = IO, params = ["Poll[IO] => IO[A]"], result = "IO[A]", rank = 25, insert = "uncancelable(poll => |)"
    doc = "Mask cancellation; poll(...) re-enables it for a region."
    see-also = [guarantee, bracket] }
  { name = fromTry, owner = IO, params = ["Try[A]"], result = "IO[A]", rank = 45
    doc = "Lift a Try: Failure becomes a raised error." }
  { name = fromFutureCancelable, owner = IO, params = ["IO[(Future[A], IO[Unit])]"], result = "IO[A]", rank = 15
    doc = "fromFuture with a cancellation action for the underlying computation." }
  { name = fromCompletableFuture, owner = IO, params = ["IO[CompletableFuture[A]]"], result = "IO[A]", rank = 30
    doc = "Convert a Java CompletableFuture created inside the IO argument. Cancelling the IO cancels the future." }
  { name = some, owner = IO, params = ["A"], result = "IO[Option[A]]", rank = 25
    doc = "IO.pure(Some(a))." }
  { name = none, owner = IO, result = "IO[Option[A]]", rank = 25, insert = "none"
    doc = "IO.pure(None)." }
  { name = print, owner = IO, params = ["A"], result = "IO[Unit]", rank = 25
    doc = "Print without a newline, as an effect." }
  { name = readLine, owner = IO, result = "IO[String]", rank = 20, insert = "readLine"
    doc = "Read a line from stdin, as an effect." }
  { name = raiseWhen, owner = IO, params = ["Boolean", "Throwable"], result = "IO[Unit]", rank = 30, insert = "raiseWhen(|)()"
    doc = "Fail with the error when the condition holds." }
  { name = raiseUnless, owner = IO, params = ["Boolean", "Throwable"], result = "IO[Unit]", rank = 25, insert = "raiseUnless(|)()"
    doc = "Fail with the error unless the condition holds." }
  { name = unlessA, owner = IO, params = ["Boolean", "IO[Unit]"], result = "IO[Unit]", rank = 30, insert = "unlessA(|)()"
    doc = "Run the effect unless the condition holds." }
  { name = racePair, owner = IO, params = ["IO[A]", "IO[B]"], result = "IO[Either[(OutcomeIO[A], FiberIO[B]), (FiberIO[A], OutcomeIO[B])]]"
    rank = 10, insert = "racePair(|, )"
    doc = "Low-level race: the loser keeps running and is handed back as a fiber. Prefer race." }
  { name = bothOutcome, owner = IO, params = ["IO[A]", "IO[B]"], result = "IO[(OutcomeIO[A], OutcomeIO[B])]", rank = 15, insert = "bothOutcome(|, )"
    doc = "Run both in parallel and return both outcomes (success, error or cancellation)." }
  { name = parSequenceN, owner = IO, params = ["Int", "T[IO[A]]"], result = "IO[T[A]]", requires { T = Traverse }, rank = 40
    insert = "parSequenceN(|)()"
    doc = "parSequence with at most n effects running at once." }
  { name = parReplicateAN, owner = IO, params = ["Int", "Int", "IO[A]"], result = "IO[List[A]]", rank = 15, insert = "parReplicateAN(|)(, )"
    doc = "Run the effect `replicas` times in parallel, at most n at once." }
  { name = realTimeInstant, owner = IO, result = "IO[Instant]", rank = 30, insert = "realTimeInstant"
    doc = "Wall-clock time as a java.time.Instant." }
  { name = randomUUID, owner = IO, result = "IO[UUID]", rank = 30, insert = "randomUUID"
    doc = "Generate a random UUID as an effect." }
  { name = executionContext, owner = IO, result = "IO[ExecutionContext]", rank = 15, insert = "executionContext"
    doc = "The compute ExecutionContext the current fiber runs on." }
  { name = interruptibleMany, owner = IO, params = ["A"], result = "IO[A]", rank = 25, insert = "interruptibleMany(|)"
    doc = "Like interruptible, but keeps interrupting the thread until the computation stops." }

  # ---------------------------------------------------------------- IO methods
  { name = handleErrorWith, owner = IO, kind = method, receiver = "IO[A]", params = ["Throwable => IO[A]"], result = "IO[A]", rank = 60
    doc = "Recover from any error with another IO." }
  { name = onError, owner = IO, kind = method, receiver = "IO[A]", params = ["PartialFunction[Throwable, IO[Unit]]"], result = "IO[A]", rank = 35
    insert = "onError { case | => }"
    doc = "Run an effect when the IO fails (logging), then re-raise the error." }
  { name = guaranteeCase, owner = IO, kind = method, receiver = "IO[A]", params = ["OutcomeIO[A] => IO[Unit]"], result = "IO[A]", rank = 25
    doc = "Finalizer that sees how the IO ended (succeeded, errored, canceled)." }
  { name = onCancel, owner = IO, kind = method, receiver = "IO[A]", params = ["IO[Unit]"], result = "IO[A]", rank = 30
    doc = "Run a finalizer only when the IO is cancelled." }
  { name = bracket, owner = IO, kind = method, receiver = "IO[A]", params = ["A => IO[B]", "A => IO[Unit]"], result = "IO[B]", rank = 35
    insert = "bracket(a => |)(a => )"
    doc = "Acquire (this IO), use, release. Prefer Resource when the resource is used in more than one place." }
  { name = timeoutTo, owner = IO, kind = method, receiver = "IO[A]", params = ["FiniteDuration", "IO[A]"], result = "IO[A]", rank = 30
    insert = "timeoutTo(|, )"
    doc = "Fall back to another IO if not completed in time." }
  { name = delayBy, owner = IO, kind = method, receiver = "IO[A]", params = ["FiniteDuration"], result = "IO[A]", rank = 35
    doc = "Sleep before running the IO." }
  { name = andWait, owner = IO, kind = method, receiver = "IO[A]", params = ["FiniteDuration"], result = "IO[A]", rank = 25
    doc = "Sleep after running the IO, keeping its result." }
  { name = timed, owner = IO, kind = method, receiver = "IO[A]", result = "IO[(FiniteDuration, A)]", rank = 35, insert = "timed"
    doc = "Measure how long the IO takes (monotonic clock)." }
  { name = evalOn, owner = IO, kind = method, receiver = "IO[A]", params = ["ExecutionContext"], result = "IO[A]", rank = 25
    doc = "Run on a specific ExecutionContext, then shift back." }
  { name = option, owner = IO, kind = method, receiver = "IO[A]", result = "IO[Option[A]]", rank = 30, insert = "option"
    doc = "Turn errors into None (the error is discarded)." }
  { name = orElse, owner = IO, kind = method, receiver = "IO[A]", params = ["IO[A]"], result = "IO[A]", rank = 35
    doc = "Run another IO if this one fails." }
  { name = race, owner = IO, kind = method, variant = method, receiver = "IO[A]", params = ["IO[B]"], result = "IO[Either[A, B]]", rank = 40
    doc = "Race against another IO; the loser is cancelled." }
  { name = both, owner = IO, kind = method, variant = method, receiver = "IO[A]", params = ["IO[B]"], result = "IO[(A, B)]", rank = 40
    doc = "Run both in parallel, return both results." }
  { name = raceOutcome, owner = IO, kind = method, receiver = "IO[A]", params = ["IO[B]"], result = "IO[Either[OutcomeIO[A], OutcomeIO[B]]]"
    rank = 10
    doc = "race, returning the outcome of the winner (it may have failed or been cancelled)." }
  { name = supervise, owner = IO, kind = method, receiver = "IO[A]", params = ["Supervisor[IO]"], result = "IO[FiberIO[A]]", rank = 20
    doc = "Start a fiber owned by a Supervisor: cancelled when the supervisor is released." }
  { name = toResource, owner = IO, kind = method, receiver = "IO[A]", result = "Resource[IO, A]", rank = 35, insert = "toResource"
    doc = "Lift into Resource (no finalizer). Same as Resource.eval(io)." }
  { name = debug, owner = IO, kind = method, receiver = "IO[A]", result = "IO[A]", rank = 15, insert = "debug()"
    doc = "Print the outcome with a prefix. Development only." }
  { name = attemptTap, owner = IO, kind = method, receiver = "IO[A]", params = ["Either[Throwable, A] => IO[B]"], result = "IO[A]", rank = 25
    doc = "Observe the result or the error without changing it." }
  { name = voidError, owner = IO, kind = method, receiver = "IO[A]", result = "IO[Unit]", rank = 20, insert = "voidError"
    doc = "Discard both the result and any error." }
  { name = parReplicateA, owner = IO, kind = method, receiver = "IO[A]", params = ["Int"], result = "IO[List[A]]", rank = 25
    doc = "Run the IO n times in parallel." }
  { name = uncancelable, owner = IO, kind = method, variant = method, receiver = "IO[A]", result = "IO[A]", rank = 20, insert = "uncancelable"
    doc = "Make the whole IO uncancelable." }

  # ---------------------------------------------------------------- kernel summoners (Sync[F]. / Async[F]. / Spawn[F]. ...)
  { name = interruptibleMany, owner = Sync, params = ["A"], result = "F[A]", rank = 25, insert = "interruptibleMany(|)"
    doc = "Sync[F].interruptibleMany: blocking, interrupted repeatedly on cancellation." }
  { name = async_, owner = Async, params = ["(Either[Throwable, A] => Unit) => Unit"], result = "F[A]", rank = 40, insert = "async_(cb => |)"
    doc = "Async[F].async_: wrap a callback-based API (not cancelable)." }
  { name = async, owner = Async, params = ["(Either[Throwable, A] => Unit) => F[Option[F[Unit]]]"], result = "F[A]", rank = 25
    insert = "async(cb => |)"
    doc = "Async[F].async: wrap a callback-based API with a cancellation finalizer." }
  { name = evalOn, owner = Async, variant = summoner, params = ["F[A]", "ExecutionContext"], result = "F[A]", rank = 30, insert = "evalOn(|, )"
    doc = "Async[F].evalOn: run on a specific ExecutionContext." }
  { name = executionContext, owner = Async, result = "F[ExecutionContext]", rank = 15, insert = "executionContext"
    doc = "Async[F].executionContext: the current compute ExecutionContext." }
  { name = fromFutureCancelable, owner = Async, params = ["F[(Future[A], F[Unit])]"], result = "F[A]", rank = 20
    doc = "Async[F].fromFutureCancelable: fromFuture with a cancellation action." }
  { name = fromCompletableFuture, owner = Async, params = ["F[CompletableFuture[A]]"], result = "F[A]", rank = 25
    doc = "Async[F].fromCompletableFuture: convert a Java CompletableFuture created inside the F argument." }
  { name = start, owner = Spawn, variant = summoner, params = ["F[A]"], result = "F[Fiber[F, Throwable, A]]", rank = 30
    doc = "Spawn[F].start: start a fiber (join or cancel it; prefer background)." }
  { name = background, owner = Spawn, variant = summoner, params = ["F[A]"], result = "Resource[F, F[Outcome[F, Throwable, A]]]", rank = 30
    doc = "Spawn[F].background: a fiber scoped to a Resource." }
  { name = race, owner = Spawn, variant = summoner, params = ["F[A]", "F[B]"], result = "F[Either[A, B]]", rank = 40, insert = "race(|, )"
    doc = "Spawn[F].race: first to finish wins, the loser is cancelled." }
  { name = both, owner = Spawn, variant = summoner, params = ["F[A]", "F[B]"], result = "F[(A, B)]", rank = 40, insert = "both(|, )"
    doc = "Spawn[F].both: run both in parallel." }
  { name = cede, owner = Spawn, result = "F[Unit]", rank = 15, insert = "cede"
    doc = "Spawn[F].cede: yield to other fibers." }
  { name = never, owner = Spawn, result = "F[A]", rank = 10, insert = "never"
    doc = "Spawn[F].never: never completes." }
  { name = deferred, owner = Concurrent, result = "F[Deferred[F, A]]", rank = 40, insert = "deferred[|]"
    doc = "Concurrent[F].deferred: create a Deferred (one-shot promise)." }
  { name = memoize, owner = Concurrent, variant = summoner, params = ["F[A]"], result = "F[F[A]]", rank = 20
    doc = "Concurrent[F].memoize: the inner F runs the effect at most once." }
  { name = parSequenceN, owner = Concurrent, variant = summoner, params = ["Int", "T[F[A]]"], result = "F[T[A]]", requires { T = Traverse }
    rank = 30, insert = "parSequenceN(|)()"
    doc = "Concurrent[F].parSequenceN: parSequence with bounded parallelism." }
  { name = parTraverseN, owner = Concurrent, variant = summoner, params = ["Int", "T[A]", "A => F[B]"], result = "F[T[B]]"
    requires { T = Traverse }, rank = 35, insert = "parTraverseN(|)()()"
    doc = "Concurrent[F].parTraverseN: parTraverse with bounded parallelism." }
  { name = timeout, owner = Temporal, variant = summoner, params = ["F[A]", "FiniteDuration"], result = "F[A]", rank = 35, insert = "timeout(|, )"
    doc = "Temporal[F].timeout: fail with TimeoutException if not done in time." }
  { name = timeoutTo, owner = Temporal, variant = summoner, params = ["F[A]", "FiniteDuration", "F[A]"], result = "F[A]", rank = 20
    insert = "timeoutTo(|, , )"
    doc = "Temporal[F].timeoutTo: fall back if not done in time." }
  { name = uncancelable, owner = MonadCancel, variant = summoner, params = ["Poll[F] => F[A]"], result = "F[A]", rank = 35
    insert = "uncancelable(poll => |)"
    doc = "MonadCancel[F].uncancelable: mask cancellation; poll re-enables it for a region." }
  { name = canceled, owner = MonadCancel, result = "F[Unit]", rank = 10, insert = "canceled"
    doc = "MonadCancel[F].canceled: request self-cancellation." }
  { name = guarantee, owner = MonadCancel, variant = summoner, params = ["F[A]", "F[Unit]"], result = "F[A]", rank = 30, insert = "guarantee(|, )"
    doc = "MonadCancel[F].guarantee: run a finalizer on success, error or cancellation." }
  { name = bracket, owner = MonadCancel, variant = summoner, params = ["F[A]", "A => F[B]", "A => F[Unit]"], result = "F[B]", rank = 30
    insert = "bracket(|)(a => )(a => )"
    doc = "MonadCancel[F].bracket: acquire, use, release." }
  { name = onCancel, owner = MonadCancel, variant = summoner, params = ["F[A]", "F[Unit]"], result = "F[A]", rank = 20, insert = "onCancel(|, )"
    doc = "MonadCancel[F].onCancel: finalizer for cancellation only." }
  { name = monotonic, owner = Clock, result = "F[FiniteDuration]", rank = 30, insert = "monotonic"
    doc = "Clock[F].monotonic: monotonic time, for measuring durations." }
  { name = realTime, owner = Clock, result = "F[FiniteDuration]", rank = 35, insert = "realTime"
    doc = "Clock[F].realTime: wall-clock time since epoch." }
  { name = timed, owner = Clock, variant = summoner, params = ["F[A]"], result = "F[(FiniteDuration, A)]", rank = 30
    doc = "Clock[F].timed: measure how long an effect takes." }
  { name = realTimeInstant, owner = Clock, result = "F[Instant]", rank = 25, insert = "realTimeInstant"
    doc = "Clock[F].realTimeInstant: wall-clock time as a java.time.Instant." }

  # ---------------------------------------------------------------- tagless-final syntax (cats.effect.syntax)
  { name = race, owner = Spawn, kind = syntax, syntax = effect.spawn, receiver = "F[A]", params = ["F[B]"], result = "F[Either[A, B]]"
    requires { F = Spawn }, rank = 45
    doc = "Race against another effect; the loser is cancelled." }
  { name = both, owner = Spawn, kind = syntax, syntax = effect.spawn, receiver = "F[A]", params = ["F[B]"], result = "F[(A, B)]"
    requires { F = Spawn }, rank = 45
    doc = "Run both in parallel, return both results." }
  { name = timeoutTo, owner = Temporal, kind = syntax, syntax = effect.temporal, receiver = "F[A]", params = ["FiniteDuration", "F[A]"]
    result = "F[A]", requires { F = Temporal }, rank = 35, insert = "timeoutTo(|, )"
    doc = "Fall back to another effect if not completed in time." }
  { name = delayBy, owner = Temporal, kind = syntax, syntax = effect.temporal, receiver = "F[A]", params = ["FiniteDuration"], result = "F[A]"
    requires { F = Temporal }, rank = 40
    doc = "Sleep before running the effect." }
  { name = andWait, owner = Temporal, kind = syntax, syntax = effect.temporal, receiver = "F[A]", params = ["FiniteDuration"], result = "F[A]"
    requires { F = Temporal }, rank = 30
    doc = "Sleep after running the effect, keeping its result." }
  { name = guaranteeCase, owner = MonadCancel, kind = syntax, syntax = effect.monadCancel, receiver = "F[A]"
    params = ["Outcome[F, E, A] => F[Unit]"], result = "F[A]", requires { F = MonadCancel }, rank = 25
    doc = "Finalizer that sees how the effect ended." }
  { name = onCancel, owner = MonadCancel, kind = syntax, syntax = effect.monadCancel, receiver = "F[A]", params = ["F[Unit]"], result = "F[A]"
    requires { F = MonadCancel }, rank = 30
    doc = "Run a finalizer only on cancellation." }
  { name = uncancelable, owner = MonadCancel, kind = syntax, syntax = effect.monadCancel, receiver = "F[A]", result = "F[A]"
    requires { F = MonadCancel }, rank = 20, insert = "uncancelable"
    doc = "Make the whole effect uncancelable." }
  { name = bracket, owner = MonadCancel, kind = syntax, syntax = effect.monadCancel, receiver = "F[A]", params = ["A => F[B]", "A => F[Unit]"]
    result = "F[B]", requires { F = MonadCancel }, rank = 30, insert = "bracket(a => |)(a => )"
    doc = "Acquire (this effect), use, release." }
  { name = parTraverseN_, owner = Concurrent, kind = syntax, syntax = effect.concurrent, receiver = "T[A]", params = ["Int", "A => F[B]"]
    result = "F[Unit]", requires { T = Foldable, F = Concurrent }, rank = 35, insert = "parTraverseN_(|)()"
    doc = "parTraverseN, discarding the results." }
  { name = parSequenceN, owner = Concurrent, kind = syntax, syntax = effect.concurrent, receiver = "T[F[A]]", params = ["Int"], result = "F[T[A]]"
    requires { T = Traverse, F = Concurrent }, rank = 40
    doc = "parSequence with bounded parallelism." }
  { name = memoize, owner = Concurrent, kind = syntax, syntax = effect.concurrent, receiver = "F[A]", result = "F[F[A]]"
    requires { F = Concurrent }, rank = 25, insert = "memoize"
    doc = "Cache the result: the inner effect runs at most once." }
  { name = parReplicateAN, owner = Concurrent, kind = syntax, syntax = effect.concurrent, receiver = "F[A]", params = ["Int", "Int"]
    result = "F[List[A]]", requires { F = Concurrent }, rank = 15, insert = "parReplicateAN(|)()"
    doc = "Replicate the effect in parallel, at most n at once." }
  { name = timed, owner = Clock, kind = syntax, syntax = effect.clock, receiver = "F[A]", result = "F[(FiniteDuration, A)]"
    requires { F = Clock }, rank = 35, insert = "timed"
    doc = "Measure how long the effect takes." }
  { name = evalOn, owner = Async, kind = syntax, syntax = effect.async, receiver = "F[A]", params = ["ExecutionContext"], result = "F[A]"
    requires { F = Async }, rank = 25
    doc = "Run on a specific ExecutionContext, then shift back." }

  # ---------------------------------------------------------------- Resource
  { name = makeCase, owner = Resource, params = ["F[A]", "(A, Resource.ExitCase) => F[Unit]"], result = "Resource[F, A]", rank = 35
    insert = "makeCase(|)((a, exit) => )"
    doc = "make, with a release that sees how the use ended." }
  { name = makeFull, owner = Resource, params = ["Poll[F] => F[A]", "A => F[Unit]"], result = "Resource[F, A]", rank = 15
    insert = "makeFull(poll => |)(a => )"
    doc = "make with an interruptible acquire (poll)." }
  { name = liftK, owner = Resource, result = "FunctionK[F, Resource[F, *]]", rank = 15, insert = "liftK"
    doc = "F ~> Resource[F, *], for mapK on algebras." }
  { name = onFinalize, owner = Resource, params = ["F[Unit]"], result = "Resource[F, Unit]", rank = 30
    doc = "A Resource whose only job is to run a finalizer on release." }
  { name = unit, owner = Resource, result = "Resource[F, Unit]", rank = 25, insert = "unit"
    doc = "An empty Resource." }
  { name = suspend, owner = Resource, params = ["F[Resource[F, A]]"], result = "Resource[F, A]", rank = 20
    doc = "Flatten an effect that builds a Resource." }
  { name = both, owner = Resource, params = ["Resource[F, A]", "Resource[F, B]"], result = "Resource[F, (A, B)]", rank = 30, insert = "both(|, )"
    doc = "Acquire both in parallel, release both." }
  { name = use_, owner = Resource, kind = method, receiver = "Resource[F, A]", result = "F[Unit]", rank = 40, insert = "use_"
    doc = "Acquire and release, ignoring the value (for resources used for their side effects)." }
  { name = evalTap, owner = Resource, kind = method, receiver = "Resource[F, A]", params = ["A => F[B]"], result = "Resource[F, A]", rank = 35
    doc = "Run an effect on the acquired value, keep the value." }
  { name = surround, owner = Resource, kind = method, receiver = "Resource[F, A]", params = ["F[B]"], result = "F[B]", rank = 30
    doc = "Run an effect while the resource is held, ignoring its value." }
  { name = onFinalize, owner = Resource, kind = method, variant = method, receiver = "Resource[F, A]", params = ["F[Unit]"]
    result = "Resource[F, A]", rank = 30
    doc = "Add a finalizer that runs on release." }
  { name = both, owner = Resource, kind = method, variant = method, receiver = "Resource[F, A]", params = ["Resource[F, B]"]
    result = "Resource[F, (A, B)]", rank = 30
    doc = "Acquire both in parallel." }
  { name = preAllocate, owner = Resource, kind = method, receiver = "Resource[F, A]", params = ["F[Unit]"], result = "Resource[F, A]", rank = 10
    doc = "Run an effect before acquisition." }

  # ---------------------------------------------------------------- Ref
  { name = empty, owner = Ref, result = "F[Ref[F, A]]", requires { A = Monoid }, rank = 20, insert = "empty[|]"
    doc = "A Ref initialised with Monoid[A].empty." }
  { name = ofEffect, owner = Ref, params = ["F[A]"], result = "F[Ref[F, A]]", rank = 15
    doc = "A Ref initialised with the result of an effect." }
  { name = unsafe, owner = Ref, params = ["A"], result = "Ref[F, A]", rank = 5, insert = "unsafe[|]()"
    doc = "Create a Ref outside of F. Breaks referential transparency, avoid." }
  { name = get, owner = Ref, kind = method, receiver = "Ref[F, A]", result = "F[A]", rank = 70, insert = "get"
    doc = "Read the current value." }
  { name = set, owner = Ref, kind = method, receiver = "Ref[F, A]", params = ["A"], result = "F[Unit]", rank = 60
    doc = "Replace the value." }
  { name = update, owner = Ref, kind = method, receiver = "Ref[F, A]", params = ["A => A"], result = "F[Unit]", rank = 70
    doc = "Atomically modify the value. Never get then set: that is a race." }
  { name = modify, owner = Ref, kind = method, receiver = "Ref[F, A]", params = ["A => (A, B)"], result = "F[B]", rank = 60
    doc = "Atomically modify the value and return a result computed from it." }
  { name = getAndUpdate, owner = Ref, kind = method, receiver = "Ref[F, A]", params = ["A => A"], result = "F[A]", rank = 40
    doc = "Atomically update and return the old value." }
  { name = updateAndGet, owner = Ref, kind = method, receiver = "Ref[F, A]", params = ["A => A"], result = "F[A]", rank = 45
    doc = "Atomically update and return the new value." }
  { name = getAndSet, owner = Ref, kind = method, receiver = "Ref[F, A]", params = ["A"], result = "F[A]", rank = 35
    doc = "Replace the value and return the old one." }
  { name = tryUpdate, owner = Ref, kind = method, receiver = "Ref[F, A]", params = ["A => A"], result = "F[Boolean]", rank = 15
    doc = "Update once, without retrying on contention." }
  { name = modifyState, owner = Ref, kind = method, receiver = "Ref[F, A]", params = ["State[A, B]"], result = "F[B]", rank = 15
    doc = "modify, with the change written as a cats.data.State." }
  { name = flatModify, owner = Ref, kind = method, receiver = "Ref[F, A]", params = ["A => (A, F[B])"], result = "F[B]", rank = 20
    doc = "modify, then run the returned effect (uncancelably)." }
  { name = access, owner = Ref, kind = method, receiver = "Ref[F, A]", result = "F[(A, A => F[Boolean])]", rank = 10, insert = "access"
    doc = "Low-level: the value plus a one-shot setter that fails if the value changed meanwhile." }

  # ---------------------------------------------------------------- Deferred / Fiber
  { name = get, owner = Deferred, kind = method, receiver = "Deferred[F, A]", result = "F[A]", rank = 60, insert = "get"
    doc = "Wait (semantically) until the Deferred is completed." }
