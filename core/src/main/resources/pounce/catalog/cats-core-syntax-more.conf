# More cats.syntax extension methods: Foldable / Traverse / TraverseFilter extras, error handling, Either / Option /
# collection helpers, Parallel and Alternative. Signatures follow cats 2.13 (cats.syntax.* and the Foo.Ops classes).
library = cats-core
kind = syntax

ops = [
  # ---------------------------------------------------------------- Functor / Apply extras
  { name = ifF, owner = Functor, syntax = functor, receiver = "F[Boolean]", params = ["A", "A"], result = "F[A]"
    requires { F = Functor }, rank = 35, insert = "ifF(|)()"
    doc = "Map a boolean in a context to one of two values."
    example = "isAdmin(user).ifF(\"admin\", \"user\")" }
  { name = unzip, owner = Functor, syntax = functor, receiver = "F[(A, B)]", result = "(F[A], F[B])"
    requires { F = Functor }, rank = 30, insert = "unzip"
    doc = "Split a context of pairs into a pair of contexts." }
  { name = fproductLeft, owner = Functor, syntax = functor, receiver = "F[A]", params = ["A => B"], result = "F[(B, A)]"
    requires { F = Functor }, rank = 25
    doc = "Pair each value with a function of it, the function result on the left." }
  { name = "<*>", owner = Apply, syntax = apply, receiver = "F[A => B]", params = ["F[A]"], result = "F[B]"
    requires { F = Apply }, rank = 30, insert = "<*> |"
    doc = "Apply a function in a context to a value in a context (ap)."
    example = "(validateName _).pure[F] <*> nameF" }
  { name = ap, owner = Apply, syntax = apply, receiver = "F[A => B]", params = ["F[A]"], result = "F[B]"
    requires { F = Apply }, rank = 20
    doc = "Named alias of <*>." }

  # ---------------------------------------------------------------- FlatMap / Monad extras
  { name = untilM_, owner = Monad, syntax = monad, receiver = "F[A]", params = ["F[Boolean]"], result = "F[Unit]"
    requires { F = Monad }, rank = 25
    doc = "Run the effect repeatedly until the condition effect yields true." }
  { name = whileM_, owner = Monad, syntax = monad, receiver = "F[A]", params = ["F[Boolean]"], result = "F[Unit]"
    requires { F = Monad }, rank = 25
    doc = "Run the effect repeatedly while the condition effect yields true." }
  { name = untilDefinedM, owner = FlatMap, syntax = flatMap, receiver = "F[Option[A]]", result = "F[A]"
    requires { F = FlatMap }, rank = 25, insert = "untilDefinedM"
    doc = "Repeat the effect until it produces Some, then return the value." }

  # ---------------------------------------------------------------- Error handling extras
  { name = attemptNarrow, owner = ApplicativeError, syntax = applicativeError, receiver = "F[A]", result = "F[Either[E, A]]"
    requires { F = ApplicativeError }, rank = 40, insert = "attemptNarrow[|]"
    doc = "Like attempt, but only errors of the given subtype go to the Left; other errors stay raised."
    example = "callApi.attemptNarrow[HttpError]" }
  { name = attemptT, owner = ApplicativeError, syntax = applicativeError, receiver = "F[A]", result = "EitherT[F, E, A]"
    requires { F = ApplicativeError }, rank = 40, insert = "attemptT"
    doc = "attempt, wrapped in EitherT." }
  { name = orElse, owner = ApplicativeError, syntax = applicativeError, receiver = "F[A]", params = ["F[A]"], result = "F[A]"
    requires { F = ApplicativeError }, rank = 50
    doc = "On any error, fall back to the other effect."
    example = "readCache(key).orElse(readDb(key))" }
  { name = orRaise, owner = ApplicativeError, syntax = applicativeError, receiver = "F[A]", params = ["E"], result = "F[A]"
    requires { F = ApplicativeError }, rank = 25
    doc = "Replace any error with the given one." }
  { name = adaptErr, owner = ApplicativeError, syntax = applicativeError, receiver = "F[A]", params = ["PartialFunction[E, E]"], result = "F[A]"
    requires { F = ApplicativeError }, rank = 25, insert = "adaptErr { case | => }"
    doc = "Transform errors with a partial function (ApplicativeError variant of adaptError)." }
  { name = attemptTap, owner = MonadError, syntax = monadError, receiver = "F[A]", params = ["Either[E, A] => F[B]"], result = "F[A]"
    requires { F = MonadError }, rank = 35
    doc = "Run an effect on the outcome (error or value) and keep the original outcome. Handy for logging." }
  { name = ensureOr, owner = MonadError, syntax = monadError, receiver = "F[A]", params = ["A => E", "A => Boolean"], result = "F[A]"
    requires { F = MonadError }, rank = 30, insert = "ensureOr(|)()"
    doc = "Raise an error built from the value unless the predicate holds." }
  { name = reject, owner = MonadError, syntax = monadError, receiver = "F[A]", params = ["PartialFunction[A, E]"], result = "F[A]"
    requires { F = MonadError }, rank = 25, insert = "reject { case | => }"
    doc = "Turn some successful values into errors." }

  # ---------------------------------------------------------------- Foldable extras
  { name = foldMapM, owner = Foldable, syntax = foldable, receiver = "F[A]", params = ["A => G[B]"], result = "G[B]"
    requires { F = Foldable, G = Monad }, rank = 50
    doc = "Effectful foldMap: map each element to an effect of a Monoid and combine the results, in order."
    example = "orders.foldMapM(o => priceOf(o))   // F[BigDecimal]" }
  { name = foldMapA, owner = Foldable, syntax = foldable, receiver = "F[A]", params = ["A => G[B]"], result = "G[B]"
    requires { F = Foldable, G = Applicative }, rank = 40
    doc = "foldMap with an Applicative effect (no short-circuiting)." }
  { name = foldA, owner = Foldable, syntax = foldable, receiver = "F[G[A]]", result = "G[A]"
    requires { F = Foldable, G = Applicative }, rank = 30, insert = "foldA"
    doc = "Run all the effects and combine their results with the Monoid." }
  { name = traverseVoid, owner = Foldable, syntax = foldable, receiver = "F[A]", params = ["A => G[B]"], result = "G[Unit]"
    requires { F = Foldable, G = Applicative }, rank = 50
    doc = "Newer name of traverse_: run an effect for each element, discarding results."
    see-also = [traverse_, traverse] }
  { name = sequenceVoid, owner = Foldable, syntax = foldable, receiver = "F[G[A]]", result = "G[Unit]"
    requires { F = Foldable, G = Applicative }, rank = 35, insert = "sequenceVoid"
    doc = "Newer name of sequence_: run all the effects, discarding results." }
  { name = foldLeftM, owner = Foldable, syntax = foldable, receiver = "F[A]", params = ["B", "(B, A) => G[B]"], result = "G[B]"
    requires { F = Foldable, G = Monad }, rank = 30, insert = "foldLeftM(|)()"
    doc = "Effectful left fold (alias of foldM)." }
  { name = collectFirstSome, owner = Foldable, syntax = foldable, receiver = "F[A]", params = ["A => Option[B]"], result = "Option[B]"
    requires { F = Foldable }, rank = 30
    doc = "The first Some produced by the function." }
  { name = collectFirstSomeM, owner = Foldable, syntax = foldable, receiver = "F[A]", params = ["A => G[Option[B]]"], result = "G[Option[B]]"
    requires { F = Foldable, G = Monad }, rank = 30
    doc = "Effectful collectFirstSome: stops at the first Some." }
  { name = collectFold, owner = Foldable, syntax = foldable, receiver = "F[A]", params = ["PartialFunction[A, B]"], result = "B"
    requires { F = Foldable }, rank = 20, insert = "collectFold { case | => }"
    doc = "Collect with a partial function and combine the results with their Monoid." }
  { name = intercalate, owner = Foldable, syntax = foldable, receiver = "F[A]", params = ["A"], result = "A"
    requires { F = Foldable, A = Monoid }, rank = 25
    doc = "Combine all elements with a separator in between (Monoid-based mkString)." }
  { name = maximumByOption, owner = Foldable, syntax = foldable, receiver = "F[A]", params = ["A => B"], result = "Option[A]"
    requires { F = Foldable }, rank = 30
    doc = "Largest element by a key with an Order, None when empty." }
  { name = minimumByOption, owner = Foldable, syntax = foldable, receiver = "F[A]", params = ["A => B"], result = "Option[A]"
    requires { F = Foldable }, rank = 30
    doc = "Smallest element by a key with an Order, None when empty." }
  { name = partitionEitherM, owner = Foldable, syntax = foldable, receiver = "F[A]", params = ["A => G[Either[B, C]]"], result = "G[(F[B], F[C])]"
    requires { F = Foldable, G = Monad }, rank = 20
    doc = "Effectful partitionEither." }
  { name = contains_, owner = UnorderedFoldable, syntax = unorderedFoldable, receiver = "F[A]", params = ["A"], result = "Boolean"
    requires { F = UnorderedFoldable, A = Eq }, rank = 20
    doc = "Membership test using Eq instead of ==." }
  { name = foldK, owner = Foldable, syntax = foldable, receiver = "F[G[A]]", result = "G[A]"
    requires { F = Foldable, G = MonoidK }, rank = 20, insert = "foldK"
    doc = "Combine all inner contexts with MonoidK (e.g. flatten a list of lists, first Some of options)." }

  # ---------------------------------------------------------------- Traverse / TraverseFilter / FunctorFilter extras
  # TraverseFilter / FunctorFilter are not in the typeclass table yet: `F = Alternative` stands in for them (every
  # Alternative with a static instance - List, Vector, Option, Chain, LazyList, Queue - also has TraverseFilter, and
  # NonEmptyList / Either / IO correctly have neither).
  { name = traverseTap, owner = Traverse, syntax = traverse, receiver = "F[A]", params = ["A => G[B]"], result = "G[F[A]]"
    requires { F = Traverse, G = Applicative }, rank = 35
    doc = "traverse for the effects, keep the original elements." }
  { name = mapWithIndex, owner = Traverse, syntax = traverse, receiver = "F[A]", params = ["(A, Int) => B"], result = "F[B]"
    requires { F = Traverse }, rank = 30
    doc = "map with the element index." }
  { name = traverseWithIndexM, owner = Traverse, syntax = traverse, receiver = "F[A]", params = ["(A, Int) => G[B]"], result = "G[F[B]]"
    requires { F = Traverse, G = Monad }, rank = 25
    doc = "traverse with the element index." }
  { name = traverseFilter, owner = TraverseFilter, syntax = traverseFilter, receiver = "F[A]", params = ["A => G[Option[B]]"], result = "G[F[B]]"
    requires { F = TraverseFilter, G = Applicative }, rank = 50
    doc = "traverse and drop the elements mapped to None."
    example = "ids.traverseFilter(id => repo.find(id))   // IO[List[User]]" }
  { name = filterA, owner = TraverseFilter, syntax = traverseFilter, receiver = "F[A]", params = ["A => G[Boolean]"], result = "G[F[A]]"
    requires { F = TraverseFilter, G = Applicative }, rank = 40
    doc = "Filter with an effectful predicate."
    example = "files.filterA(f => exists(f))" }
  { name = traverseCollect, owner = TraverseFilter, syntax = traverseFilter, receiver = "F[A]", params = ["PartialFunction[A, G[B]]"], result = "G[F[B]]"
    requires { F = TraverseFilter, G = Applicative }, rank = 20, insert = "traverseCollect { case | => }"
    doc = "traverse the elements a partial function is defined for, drop the others." }
  { name = traverseEither, owner = TraverseFilter, syntax = traverseFilter, receiver = "F[A]", params = ["A => G[Either[B, C]]", "(A, B) => G[Unit]"], result = "G[F[C]]"
    requires { F = TraverseFilter, G = Monad }, rank = 15, insert = "traverseEither(|)()"
    doc = "traverseFilter on Eithers: keep the Rights, handle each Left with the second function." }
  { name = mapFilter, owner = FunctorFilter, syntax = functorFilter, receiver = "F[A]", params = ["A => Option[B]"], result = "F[B]"
    requires { F = FunctorFilter }, rank = 40
    doc = "map and drop the Nones in one pass (flatMap(f(_).toList) for any FunctorFilter)." }
  { name = flattenOption, owner = FunctorFilter, syntax = functorFilter, receiver = "F[Option[A]]", result = "F[A]"
    requires { F = FunctorFilter }, rank = 35, insert = "flattenOption"
    doc = "Drop the Nones, unwrap the Somes." }

  # ---------------------------------------------------------------- Reducible / NonEmptyTraverse
  { name = reduceMap, owner = Reducible, syntax = reducible, receiver = "F[A]", params = ["A => B"], result = "B"
    requires { F = Reducible }, rank = 30
    doc = "Map each element to a Semigroup and combine them: foldMap without needing a Monoid (non-empty structures)." }
  { name = nonEmptyTraverse, owner = NonEmptyTraverse, syntax = nonEmptyTraverse, receiver = "F[A]", params = ["A => G[B]"], result = "G[F[B]]"
    requires { F = NonEmptyTraverse, G = Apply }, rank = 30
    doc = "traverse a non-empty structure with an Apply (no pure needed)." }
  { name = nonEmptyTraverseVoid, owner = Reducible, syntax = reducible, receiver = "F[A]", params = ["A => G[B]"], result = "G[Unit]"
    requires { F = Reducible, G = Apply }, rank = 20
    doc = "traverseVoid for non-empty structures with an Apply." }

  # ---------------------------------------------------------------- Alternative
  { name = separate, owner = Alternative, syntax = alternative, receiver = "F[G[A, B]]", result = "(F[A], F[B])"
    requires { F = Alternative, G = Bifoldable }, rank = 40, insert = "separate"
    doc = "Split a structure of Eithers (or any Bifoldable) into lefts and rights."
    example = "results.separate   // (List[Error], List[Value])" }
  { name = unite, owner = Alternative, syntax = alternative, receiver = "F[G[A]]", result = "F[A]"
    requires { F = Alternative, G = Foldable }, rank = 25, insert = "unite"
    doc = "Flatten the inner Foldable (drop the Nones of a List[Option[A]])." }

  # ---------------------------------------------------------------- Parallel extras
  { name = parFlatSequence, owner = Parallel, syntax = parallel, receiver = "F[M[F[A]]]", result = "M[F[A]]"
    requires { F = Traverse, M = Parallel }, rank = 20, insert = "parFlatSequence"
    doc = "flatSequence, in parallel." }
  { name = parUnorderedTraverse, owner = Parallel, syntax = parallel, receiver = "F[A]", params = ["A => M[B]"], result = "M[F[B]]"
    requires { F = UnorderedTraverse, M = Parallel }, rank = 25
    doc = "parTraverse for unordered structures (Set, Map values)." }
  { name = parTraverseVoid, owner = Parallel, syntax = parallel, receiver = "F[A]", params = ["A => M[B]"], result = "M[Unit]"
    requires { F = Foldable, M = Parallel }, rank = 40
    doc = "Newer name of parTraverse_: run an effect per element in parallel, discarding results." }
  { name = parTraverseFilter, owner = Parallel, syntax = parallel, receiver = "F[A]", params = ["A => M[Option[B]]"], result = "M[F[B]]"
    requires { F = TraverseFilter, M = Parallel }, rank = 25
    doc = "traverseFilter, in parallel." }
  { name = parFilterA, owner = Parallel, syntax = parallel, receiver = "F[A]", params = ["A => M[Boolean]"], result = "M[F[A]]"
    requires { F = TraverseFilter, M = Parallel }, rank = 20
    doc = "filterA, evaluating the predicates in parallel." }
  { name = parProduct, owner = Parallel, syntax = parallel, receiver = "M[A]", params = ["M[B]"], result = "M[(A, B)]"
    requires { M = NonEmptyParallel }, rank = 25
    doc = "product, in parallel. Prefer (fa, fb).parTupled." }
  { name = parFoldMapA, owner = Parallel, syntax = parallel, receiver = "F[A]", params = ["A => M[B]"], result = "M[B]"
    requires { F = Foldable, M = Parallel }, rank = 20
    doc = "foldMapA, running the effects in parallel." }

  # ---------------------------------------------------------------- Semigroup / Hash
  { name = combineN, owner = Semigroup, syntax = semigroup, receiver = "A", params = ["Int"], result = "A"
    requires { A = Semigroup }, rank = 20
    doc = "Combine a value with itself n times." }
  { name = hash, owner = Hash, syntax = hash, receiver = "A", result = "Int"
    requires { A = Hash }, rank = 20, insert = "hash"
    doc = "Type-safe hashCode via Hash." }

  # ---------------------------------------------------------------- Either extras
  { name = ensure, owner = Either, variant = either, syntax = either, receiver = "Either[E, A]", params = ["E", "A => Boolean"], result = "Either[E, A]"
    rank = 35, insert = "ensure(|)()"
    doc = "Turn a Right into the given Left unless the predicate holds." }
  { name = toValidated, owner = Either, syntax = either, receiver = "Either[E, A]", result = "Validated[E, A]"
    rank = 40, insert = "toValidated"
    doc = "Switch to error accumulation (Validated)." }
  { name = toIor, owner = Either, syntax = either, receiver = "Either[E, A]", result = "Ior[E, A]"
    rank = 20, insert = "toIor"
    doc = "Convert to Ior." }
  { name = toEitherNel, owner = Either, syntax = either, receiver = "Either[E, A]", result = "Either[NonEmptyList[E], A]"
    rank = 35, insert = "toEitherNel"
    doc = "Wrap the Left in a NonEmptyList, ready for parMapN error accumulation." }
  { name = toEitherNec, owner = Either, syntax = either, receiver = "Either[E, A]", result = "Either[NonEmptyChain[E], A]"
    rank = 30, insert = "toEitherNec"
    doc = "Wrap the Left in a NonEmptyChain, ready for parMapN error accumulation." }
  { name = leftWiden, owner = Bifunctor, syntax = bifunctor, receiver = "F[E, A]", result = "F[C, A]"
    requires { F = Bifunctor }, rank = 25, insert = "leftWiden[|]"
    doc = "Upcast the left type: Either[NotFound, A] to Either[AppError, A]." }
  { name = raiseOrPure, owner = Either, syntax = either, receiver = "Either[E, A]", result = "F[A]"
    requires { F = ApplicativeError }, rank = 30, insert = "raiseOrPure[|]"
    doc = "Lift into F: pure for Right, raiseError for Left (same as liftTo)." }

  # ---------------------------------------------------------------- Option extras
  { name = toValid, owner = Option, syntax = option, receiver = "Option[A]", params = ["E"], result = "Validated[E, A]"
    rank = 35
    doc = "Valid when Some, Invalid(e) when None." }
  { name = toValidNec, owner = Option, syntax = option, receiver = "Option[A]", params = ["E"], result = "ValidatedNec[E, A]"
    rank = 35
    doc = "Valid when Some, Invalid(NonEmptyChain(e)) when None." }
  { name = toInvalidNel, owner = Option, syntax = option, receiver = "Option[A]", params = ["B"], result = "ValidatedNel[A, B]"
    rank = 20
    doc = "Invalid(NonEmptyList(a)) when Some, Valid(b) when None." }
  { name = toLeftNel, owner = Option, syntax = option, receiver = "Option[A]", params = ["B"], result = "Either[NonEmptyList[A], B]"
    rank = 20
    doc = "Left(NonEmptyList(a)) when Some, Right(b) when None." }
  { name = toRightNec, owner = Option, syntax = option, receiver = "Option[A]", params = ["E"], result = "Either[NonEmptyChain[E], A]"
    rank = 25
    doc = "Right when Some, Left(NonEmptyChain(e)) when None." }
  { name = toOptionT, owner = Option, syntax = option, receiver = "Option[A]", result = "OptionT[F, A]"
    requires { F = Applicative }, rank = 40, insert = "toOptionT[|]"
    doc = "Wrap into OptionT[F, A]." }
  { name = raiseTo, owner = Option, syntax = option, receiver = "Option[E]", result = "F[Unit]"
    requires { F = ApplicativeError }, rank = 20, insert = "raiseTo[|]"
    doc = "Raise the contained error, or do nothing for None." }

  # ---------------------------------------------------------------- List / Vector / Seq extras
  { name = groupByNec, owner = List, syntax = list, receiver = "List[A]", params = ["A => B"], result = "SortedMap[B, NonEmptyChain[A]]"
    rank = 25
    doc = "groupBy with NonEmptyChain groups (needs Order[B])." }
  { name = scanLeftNel, owner = List, syntax = list, receiver = "List[A]", params = ["B", "(B, A) => B"], result = "NonEmptyList[B]"
    rank = 15, insert = "scanLeftNel(|)()"
    doc = "scanLeft returning a NonEmptyList (the result always has the initial value)." }
  { name = toNev, owner = Vector, syntax = vector, receiver = "Vector[A]", result = "Option[NonEmptyVector[A]]"
    rank = 40, insert = "toNev"
    doc = "Some(NonEmptyVector) when the vector has elements, None when empty." }
  { name = groupByNev, owner = Vector, syntax = vector, receiver = "Vector[A]", params = ["A => B"], result = "SortedMap[B, NonEmptyVector[A]]"
    rank = 20
    doc = "groupBy with NonEmptyVector groups (needs Order[B])." }
  { name = toNeSeq, owner = Seq, syntax = seq, receiver = "Seq[A]", result = "Option[NonEmptySeq[A]]"
    rank = 25, insert = "toNeSeq"
    doc = "Some(NonEmptySeq) when the seq has elements, None when empty." }
]
