# Extension methods on *any* value (receiver "A"): lift a plain value into a context.
# Completion ranks these by the expected type: `.asRight` first when an Either is expected, etc.
library = cats-core
kind = lift

ops = [
  { name = some, owner = Option, syntax = option, receiver = "A", result = "Option[A]", rank = 80, insert = "some"
    doc = "Some(a), typed as Option[A] (not Some[A]), which avoids inference problems in folds and for-comprehensions."
    example = "user.some   // Option[User]" }
  { name = asRight, owner = Either, syntax = either, receiver = "A", result = "Either[E, A]", rank = 80, insert = "asRight[|]"
    doc = "Right(a), typed as Either[E, A]."
    example = "user.asRight[AppError]" }
  { name = asLeft, owner = Either, syntax = either, receiver = "A", result = "Either[A, B]", rank = 75, insert = "asLeft[|]"
    doc = "Left(a), typed as Either[A, B]."
    example = "NotFound.asLeft[User]" }
  { name = rightNel, owner = Either, syntax = either, receiver = "A", result = "Either[NonEmptyList[E], A]", rank = 30, insert = "rightNel[|]"
    doc = "Right(a), typed as EitherNel[E, A]." }
  { name = leftNel, owner = Either, syntax = either, receiver = "A", result = "Either[NonEmptyList[A], B]", rank = 30, insert = "leftNel[|]"
    doc = "Left(NonEmptyList.one(a))." }
  { name = pure, owner = Applicative, syntax = applicative, receiver = "A", result = "F[A]"
    requires { F = Applicative }, rank = 85, insert = "pure[|]"
    doc = "Lift a value into any Applicative F."
    example = "user.pure[F]   // in tagless-final code" }
  { name = raiseError, owner = ApplicativeError, syntax = applicativeError, receiver = "E", result = "F[A]"
    requires { F = ApplicativeError }, rank = 70, insert = "raiseError[|]"
    doc = "Raise this error into F."
    example = "UserNotFound(id).raiseError[F, User]" }
  { name = valid, owner = Validated, syntax = validated, receiver = "A", result = "Validated[E, A]", rank = 45, insert = "valid[|]"
    doc = "Valid(a), typed as Validated[E, A]." }
  { name = invalid, owner = Validated, syntax = validated, receiver = "E", result = "Validated[E, A]", rank = 45, insert = "invalid[|]"
    doc = "Invalid(e), typed as Validated[E, A]." }
  { name = validNel, owner = Validated, syntax = validated, receiver = "A", result = "ValidatedNel[E, A]", rank = 55, insert = "validNel[|]"
    doc = "Valid(a), typed as ValidatedNel[E, A]."
    example = "name.validNel[String]" }
  { name = invalidNel, owner = Validated, syntax = validated, receiver = "E", result = "ValidatedNel[E, A]", rank = 55, insert = "invalidNel[|]"
    doc = "Invalid(NonEmptyList.one(e))."
    example = "\"name is empty\".invalidNel[String]" }
  { name = validNec, owner = Validated, syntax = validated, receiver = "A", result = "ValidatedNec[E, A]", rank = 40, insert = "validNec[|]"
    doc = "Valid(a), typed as ValidatedNec[E, A]." }
  { name = invalidNec, owner = Validated, syntax = validated, receiver = "E", result = "ValidatedNec[E, A]", rank = 40, insert = "invalidNec[|]"
    doc = "Invalid(NonEmptyChain.one(e))." }
  { name = rightIor, owner = Ior, syntax = ior, receiver = "A", result = "Ior[E, A]", rank = 20, insert = "rightIor[|]"
    doc = "Ior.Right(a)." }
  { name = leftIor, owner = Ior, syntax = ior, receiver = "E", result = "Ior[E, A]", rank = 20, insert = "leftIor[|]"
    doc = "Ior.Left(e)." }
  { name = rightNec, owner = Either, syntax = either, receiver = "A", result = "Either[NonEmptyChain[E], A]", rank = 30, insert = "rightNec[|]"
    doc = "Right(a), typed as EitherNec[E, A]." }
  { name = leftNec, owner = Either, syntax = either, receiver = "A", result = "Either[NonEmptyChain[A], B]", rank = 30, insert = "leftNec[|]"
    doc = "Left(NonEmptyChain.one(a)), typed as EitherNec[A, B]." }
  { name = iterateWhileM, owner = Monad, syntax = monad, receiver = "A", params = ["A => F[A]", "A => Boolean"], result = "F[A]"
    requires { F = Monad }, rank = 25, insert = "iterateWhileM(|)()"
    doc = "Starting from this value, apply the effectful step while the predicate holds."
    example = "0.iterateWhileM(n => fetchPage(n).as(n + 1))(_ < pages)" }
  { name = iterateUntilM, owner = Monad, syntax = monad, receiver = "A", params = ["A => F[A]", "A => Boolean"], result = "F[A]"
    requires { F = Monad }, rank = 25, insert = "iterateUntilM(|)()"
    doc = "Starting from this value, apply the effectful step until the predicate holds." }
  { name = tailRecM, owner = FlatMap, syntax = flatMap, receiver = "A", params = ["A => F[Either[A, B]]"], result = "F[B]"
    requires { F = FlatMap }, rank = 15
    doc = "Stack-safe monadic loop: Left continues with a new state, Right stops with the result." }
  { name = guard, owner = Alternative, syntax = alternative, receiver = "Boolean", result = "F[Unit]"
    requires { F = Alternative }, rank = 20, insert = "guard[|]"
    doc = "F.unit when true, the empty F (None, Nil) when false. Filters inside for-comprehensions." }
]
