# Extension methods from cats.syntax.* on a value in a context: F[A].
# Shape variables: single upper-case letters. `requires` constrains them with typeclasses.
library = cats-core
kind = syntax

ops = [
  # ---------------------------------------------------------------- Functor
  { name = map, owner = Functor, syntax = functor, receiver = "F[A]", params = ["A => B"], result = "F[B]"
    requires { F = Functor }, rank = 60
    doc = "Transform the value inside the context."
    example = "fa.map(_.name)" }
  { name = void, owner = Functor, syntax = functor, receiver = "F[A]", result = "F[Unit]"
    requires { F = Functor }, rank = 85, insert = "void"
    doc = "Discard the result, keeping the effect. Same as .map(_ => ())."
    example = "repo.insert(user).void   // F[Unit]"
    see-also = [as] }
  { name = as, owner = Functor, syntax = functor, receiver = "F[A]", params = ["B"], result = "F[B]"
    requires { F = Functor }, rank = 80
    doc = "Replace the result with a constant, keeping the effect. Same as .map(_ => b)."
    example = "deleteUser(id).as(NoContent)"
    see-also = [void] }
  { name = fproduct, owner = Functor, syntax = functor, receiver = "F[A]", params = ["A => B"], result = "F[(A, B)]"
    requires { F = Functor }, rank = 40
    doc = "Pair each value with the result of a function applied to it."
    example = "List(1, 2).fproduct(_ * 10)   // List((1,10), (2,20))" }
  { name = tupleLeft, owner = Functor, syntax = functor, receiver = "F[A]", params = ["B"], result = "F[(B, A)]"
    requires { F = Functor }, rank = 35
    doc = "Tuple a constant on the left of the value."
    example = "fa.tupleLeft(id)" }
  { name = tupleRight, owner = Functor, syntax = functor, receiver = "F[A]", params = ["B"], result = "F[(A, B)]"
    requires { F = Functor }, rank = 35
    doc = "Tuple a constant on the right of the value."
    example = "fa.tupleRight(id)" }
  { name = widen, owner = Functor, syntax = functor, receiver = "F[A]", result = "F[B]"
    requires { F = Functor }, rank = 45, insert = "widen[|]"
    doc = "Upcast the value type: F[Dog] to F[Animal]. Fixes invariance errors without map(identity)."
    example = "fetchDog.widen[Animal]" }

  # ---------------------------------------------------------------- Apply / Applicative
  { name = "*>", owner = Apply, syntax = apply, receiver = "F[A]", params = ["F[B]"], result = "F[B]"
    requires { F = Apply }, rank = 75, insert = "*>(|)"
    doc = "Run this, then that (independently); keep the second result. The argument is evaluated eagerly as a value."
    example = "log.info(\"saving\") *> repo.save(user)"
    see-also = [">>", "<*", productR] }
  { name = "<*", owner = Apply, syntax = apply, receiver = "F[A]", params = ["F[B]"], result = "F[A]"
    requires { F = Apply }, rank = 70, insert = "<*(|)"
    doc = "Run this, then that; keep the first result."
    example = "repo.save(user) <* log.info(\"saved\")"
    see-also = ["*>"] }
  { name = productR, owner = Apply, syntax = apply, receiver = "F[A]", params = ["F[B]"], result = "F[B]"
    requires { F = Apply }, rank = 30
    doc = "Named alias of *>." }
  { name = productL, owner = Apply, syntax = apply, receiver = "F[A]", params = ["F[B]"], result = "F[A]"
    requires { F = Apply }, rank = 30
    doc = "Named alias of <*." }
  { name = product, owner = Semigroupal, syntax = semigroupal, receiver = "F[A]", params = ["F[B]"], result = "F[(A, B)]"
    requires { F = Semigroupal }, rank = 40
    doc = "Combine two independent effects into a tuple. Prefer (fa, fb).tupled for readability."
    example = "fetchUser.product(fetchOrders)" }
  { name = map2, owner = Apply, syntax = apply, receiver = "F[A]", params = ["F[B]", "(A, B) => C"], result = "F[C]"
    requires { F = Apply }, rank = 35, insert = "map2(|)()"
    doc = "Combine two independent effects with a function. Prefer (fa, fb).mapN(f)."
    see-also = [mapN] }
  { name = whenA, owner = Applicative, syntax = applicative, receiver = "F[A]", params = ["Boolean"], result = "F[Unit]"
    requires { F = Applicative }, rank = 70
    doc = "Run the effect only when the condition holds, otherwise do nothing (F.unit)."
    example = "sendEmail(user).whenA(user.subscribed)"
    see-also = [unlessA] }
  { name = unlessA, owner = Applicative, syntax = applicative, receiver = "F[A]", params = ["Boolean"], result = "F[Unit]"
    requires { F = Applicative }, rank = 60
    doc = "Run the effect unless the condition holds."
    example = "createTable.unlessA(tableExists)"
    see-also = [whenA] }
  { name = replicateA, owner = Applicative, syntax = applicative, receiver = "F[A]", params = ["Int"], result = "F[List[A]]"
    requires { F = Applicative }, rank = 45
    doc = "Run the effect n times, collecting results."
    example = "randomInt.replicateA(5)   // F[List[Int]]"
    see-also = [replicateA_, parReplicateA] }
  { name = replicateA_, owner = Applicative, syntax = applicative, receiver = "F[A]", params = ["Int"], result = "F[Unit]"
    requires { F = Applicative }, rank = 35
    doc = "Run the effect n times, discarding results." }

  # ---------------------------------------------------------------- FlatMap / Monad
  { name = flatMap, owner = FlatMap, syntax = flatMap, receiver = "F[A]", params = ["A => F[B]"], result = "F[B]"
    requires { F = FlatMap }, rank = 60
    doc = "Sequence a dependent effect."
    example = "findUser(id).flatMap(u => sendEmail(u))" }
  { name = ">>", owner = FlatMap, syntax = flatMap, receiver = "F[A]", params = ["F[B]"], result = "F[B]"
    requires { F = FlatMap }, rank = 75, insert = ">> |"
    doc = "Run this, then that; keep the second result. Unlike *>, the right side is by-name (lazy), so it is safe for recursion."
    example = "connect >> loop"
    see-also = ["*>", flatMap] }
  { name = flatTap, owner = FlatMap, syntax = flatMap, receiver = "F[A]", params = ["A => F[B]"], result = "F[A]"
    requires { F = FlatMap }, rank = 70
    doc = "Run a dependent effect for its side effect, keep the original value."
    example = "createUser(req).flatTap(u => audit.log(s\"created ${u.id}\"))" }
  { name = flatten, owner = FlatMap, syntax = flatMap, receiver = "F[F[A]]", result = "F[A]"
    requires { F = FlatMap }, rank = 50, insert = "flatten"
    doc = "Remove one layer of nesting: F[F[A]] to F[A]." }
  { name = mproduct, owner = FlatMap, syntax = flatMap, receiver = "F[A]", params = ["A => F[B]"], result = "F[(A, B)]"
    requires { F = FlatMap }, rank = 30
    doc = "Run a dependent effect and keep both values." }
  { name = ifM, owner = FlatMap, syntax = flatMap, receiver = "F[Boolean]", params = ["F[B]", "F[B]"], result = "F[B]"
    requires { F = FlatMap }, rank = 55, insert = "ifM(|, )"
    doc = "Branch on an effectful condition."
    example = "userExists(id).ifM(update(user), insert(user))" }
  { name = foreverM, owner = FlatMap, syntax = flatMap, receiver = "F[A]", result = "F[B]"
    requires { F = FlatMap }, rank = 45, insert = "foreverM"
    doc = "Repeat forever (until an error or cancellation)."
    example = "pollQueue.foreverM" }
  { name = iterateWhile, owner = Monad, syntax = monad, receiver = "F[A]", params = ["A => Boolean"], result = "F[A]"
    requires { F = Monad }, rank = 40
    doc = "Repeat the effect while the predicate holds on its result."
    example = "fetchStatus.iterateWhile(_ == Pending)" }
  { name = iterateUntil, owner = Monad, syntax = monad, receiver = "F[A]", params = ["A => Boolean"], result = "F[A]"
    requires { F = Monad }, rank = 40
    doc = "Repeat the effect until the predicate holds on its result." }

  # ---------------------------------------------------------------- Error handling
  { name = attempt, owner = ApplicativeError, syntax = applicativeError, receiver = "F[A]", result = "F[Either[E, A]]"
    requires { F = ApplicativeError }, rank = 70, insert = "attempt"
    doc = "Materialise errors into an Either."
    example = "callApi.attempt.map { case Left(e) => fallback; case Right(r) => r }"
    see-also = [redeem, redeemWith, handleErrorWith] }
  { name = handleErrorWith, owner = ApplicativeError, syntax = applicativeError, receiver = "F[A]", params = ["E => F[A]"], result = "F[A]"
    requires { F = ApplicativeError }, rank = 70
    doc = "Recover from any error with another effect." }
  { name = handleError, owner = ApplicativeError, syntax = applicativeError, receiver = "F[A]", params = ["E => A"], result = "F[A]"
    requires { F = ApplicativeError }, rank = 60
    doc = "Recover from any error with a pure value." }
  { name = recover, owner = ApplicativeError, syntax = applicativeError, receiver = "F[A]", params = ["PartialFunction[E, A]"], result = "F[A]"
    requires { F = ApplicativeError }, rank = 55, insert = "recover { case | => }"
    doc = "Recover from some errors with a pure value." }
  { name = recoverWith, owner = ApplicativeError, syntax = applicativeError, receiver = "F[A]", params = ["PartialFunction[E, F[A]]"], result = "F[A]"
    requires { F = ApplicativeError }, rank = 55, insert = "recoverWith { case | => }"
    doc = "Recover from some errors with another effect." }
  { name = redeem, owner = ApplicativeError, syntax = applicativeError, receiver = "F[A]", params = ["E => B", "A => B"], result = "F[B]"
    requires { F = ApplicativeError }, rank = 55, insert = "redeem(|, )"
    doc = "Map both the error and the success channel to a value. Faster than attempt.map." }
  { name = redeemWith, owner = MonadError, syntax = monadError, receiver = "F[A]", params = ["E => F[B]", "A => F[B]"], result = "F[B]"
    requires { F = MonadError }, rank = 55, insert = "redeemWith(|, )"
    doc = "flatMap both the error and the success channel. Faster than attempt.flatMap." }
  { name = onError, owner = ApplicativeError, syntax = applicativeError, receiver = "F[A]", params = ["PartialFunction[E, F[Unit]]"], result = "F[A]"
    requires { F = ApplicativeError }, rank = 50, insert = "onError { case | => }"
    doc = "Run an effect when an error happens (logging), then re-raise." }
  { name = adaptError, owner = MonadError, syntax = monadError, receiver = "F[A]", params = ["PartialFunction[E, E]"], result = "F[A]"
    requires { F = MonadError }, rank = 45, insert = "adaptError { case | => }"
    doc = "Transform errors (e.g. wrap low-level exceptions into domain errors)." }
  { name = rethrow, owner = MonadError, syntax = monadError, receiver = "F[Either[E, A]]", result = "F[A]"
    requires { F = MonadError }, rank = 55, insert = "rethrow"
    doc = "Lift a Left into the error channel: F[Either[E, A]] to F[A]." }
  { name = ensure, owner = MonadError, syntax = monadError, receiver = "F[A]", params = ["E", "A => Boolean"], result = "F[A]"
    requires { F = MonadError }, rank = 40, insert = "ensure(|)()"
    doc = "Raise the given error unless the predicate holds." }

  # ---------------------------------------------------------------- Foldable
  { name = foldMap, owner = Foldable, syntax = foldable, receiver = "F[A]", params = ["A => B"], result = "B"
    requires { F = Foldable }, rank = 65
    doc = "Map each element to a Monoid and combine them all."
    example = "orders.foldMap(_.total)   // sums with Monoid[BigDecimal]" }
  { name = combineAll, owner = Foldable, syntax = foldable, receiver = "F[A]", result = "A"
    requires { F = Foldable, A = Monoid }, rank = 60, insert = "combineAll"
    doc = "Combine all elements using their Monoid."
    example = "List(1, 2, 3).combineAll   // 6" }
  { name = combineAllOption, owner = Foldable, syntax = foldable, receiver = "F[A]", result = "Option[A]"
    requires { F = Foldable, A = Semigroup }, rank = 35, insert = "combineAllOption"
    doc = "Combine all elements with a Semigroup; None when empty." }
  { name = traverse_, owner = Foldable, syntax = foldable, receiver = "F[A]", params = ["A => G[B]"], result = "G[Unit]"
    requires { F = Foldable, G = Applicative }, rank = 75
    doc = "Run an effect for each element, discarding results."
    example = "users.traverse_(u => sendEmail(u))"
    see-also = [traverse, parTraverse_] }
  { name = sequence_, owner = Foldable, syntax = foldable, receiver = "F[G[A]]", result = "G[Unit]"
    requires { F = Foldable, G = Applicative }, rank = 55, insert = "sequence_"
    doc = "Run all the effects, discarding results." }
  { name = foldM, owner = Foldable, syntax = foldable, receiver = "F[A]", params = ["B", "(B, A) => G[B]"], result = "G[B]"
    requires { F = Foldable, G = Monad }, rank = 45, insert = "foldM(|)()"
    doc = "Effectful left fold." }
  { name = existsM, owner = Foldable, syntax = foldable, receiver = "F[A]", params = ["A => G[Boolean]"], result = "G[Boolean]"
    requires { F = Foldable, G = Monad }, rank = 35
    doc = "Effectful exists (short-circuits)." }
  { name = forallM, owner = Foldable, syntax = foldable, receiver = "F[A]", params = ["A => G[Boolean]"], result = "G[Boolean]"
    requires { F = Foldable, G = Monad }, rank = 35
    doc = "Effectful forall (short-circuits)." }
  { name = findM, owner = Foldable, syntax = foldable, receiver = "F[A]", params = ["A => G[Boolean]"], result = "G[Option[A]]"
    requires { F = Foldable, G = Monad }, rank = 30
    doc = "Effectful find (short-circuits)." }
  { name = mkString_, owner = Foldable, syntax = foldable, receiver = "F[A]", params = ["String"], result = "String"
    requires { F = Foldable, A = Show }, rank = 30
    doc = "mkString using Show instead of toString." }
  { name = maximumOption, owner = Foldable, syntax = foldable, receiver = "F[A]", result = "Option[A]"
    requires { F = Foldable, A = Order }, rank = 30, insert = "maximumOption"
    doc = "Largest element by Order, None when empty." }
  { name = minimumOption, owner = Foldable, syntax = foldable, receiver = "F[A]", result = "Option[A]"
    requires { F = Foldable, A = Order }, rank = 30, insert = "minimumOption"
    doc = "Smallest element by Order, None when empty." }
  { name = partitionEither, owner = Foldable, syntax = foldable, receiver = "F[A]", params = ["A => Either[B, C]"], result = "(F[B], F[C])"
    requires { F = Foldable }, rank = 35
    doc = "Split into lefts and rights with a function." }

  # ---------------------------------------------------------------- Traverse
  { name = traverse, owner = Traverse, syntax = traverse, receiver = "F[A]", params = ["A => G[B]"], result = "G[F[B]]"
    requires { F = Traverse, G = Applicative }, rank = 95
    doc = "Map each element to an effect and collect the results inside that effect."
    example = "ids.traverse(id => fetchUser(id))   // IO[List[User]]"
    see-also = [traverse_, flatTraverse, parTraverse, sequence] }
  { name = sequence, owner = Traverse, syntax = traverse, receiver = "F[G[A]]", result = "G[F[A]]"
    requires { F = Traverse, G = Applicative }, rank = 90, insert = "sequence"
    doc = "Turn a structure of effects inside out: List[IO[A]] to IO[List[A]]."
    example = "List(IO(1), IO(2)).sequence   // IO[List[Int]]"
    see-also = [traverse, parSequence] }
  { name = flatTraverse, owner = Traverse, syntax = traverse, receiver = "F[A]", params = ["A => G[F[B]]"], result = "G[F[B]]"
    requires { F = Traverse, G = Applicative }, rank = 55
    doc = "traverse, then flatten the inner structure."
    example = "userIds.flatTraverse(id => fetchOrders(id))   // IO[List[Order]]" }
  { name = flatSequence, owner = Traverse, syntax = traverse, receiver = "F[G[F[A]]]", result = "G[F[A]]"
    requires { F = Traverse, G = Applicative }, rank = 35, insert = "flatSequence"
    doc = "sequence, then flatten." }
  { name = zipWithIndex, owner = Traverse, syntax = traverse, receiver = "F[A]", result = "F[(A, Int)]"
    requires { F = Traverse }, rank = 30, insert = "zipWithIndex"
    doc = "Pair each element with its index (works for any Traverse, not just collections)." }
  { name = mapAccumulate, owner = Traverse, syntax = traverse, receiver = "F[A]", params = ["S", "(S, A) => (S, B)"], result = "(S, F[B])"
    requires { F = Traverse }, rank = 25, insert = "mapAccumulate(|)()"
    doc = "Map with state threaded left to right." }

  # ---------------------------------------------------------------- Parallel
  { name = parTraverse, owner = Parallel, syntax = parallel, receiver = "F[A]", params = ["A => M[B]"], result = "M[F[B]]"
    requires { F = Traverse, M = Parallel }, rank = 80
    doc = "traverse, running the effects in parallel. Unbounded: consider parTraverseN for large inputs."
    example = "urls.parTraverse(fetch)"
    see-also = [traverse, parTraverseN, parTraverse_] }
  { name = parSequence, owner = Parallel, syntax = parallel, receiver = "F[M[A]]", result = "M[F[A]]"
    requires { F = Traverse, M = Parallel }, rank = 65, insert = "parSequence"
    doc = "sequence, running the effects in parallel." }
  { name = parTraverse_, owner = Parallel, syntax = parallel, receiver = "F[A]", params = ["A => M[B]"], result = "M[Unit]"
    requires { F = Foldable, M = Parallel }, rank = 55
    doc = "traverse_, in parallel." }
  { name = parSequence_, owner = Parallel, syntax = parallel, receiver = "F[M[A]]", result = "M[Unit]"
    requires { F = Foldable, M = Parallel }, rank = 40, insert = "parSequence_"
    doc = "sequence_, in parallel." }
  { name = parFlatTraverse, owner = Parallel, syntax = parallel, receiver = "F[A]", params = ["A => M[F[B]]"], result = "M[F[B]]"
    requires { F = Traverse, M = Parallel }, rank = 30
    doc = "flatTraverse, in parallel." }
  { name = parReplicateA, owner = Parallel, syntax = parallel, receiver = "M[A]", params = ["Int"], result = "M[List[A]]"
    requires { M = Parallel }, rank = 25
    doc = "replicateA, in parallel." }

  # ---------------------------------------------------------------- SemigroupK / Semigroup / Eq / Show
  { name = "<+>", owner = SemigroupK, syntax = semigroupk, receiver = "F[A]", params = ["F[A]"], result = "F[A]"
    requires { F = SemigroupK }, rank = 45, insert = "<+> |"
    doc = "Combine two contexts: first success wins for effects/options, concatenation for lists, route fallback for http4s."
    example = "userRoutes <+> adminRoutes" }
  { name = combineK, owner = SemigroupK, syntax = semigroupk, receiver = "F[A]", params = ["F[A]"], result = "F[A]"
    requires { F = SemigroupK }, rank = 25
    doc = "Named alias of <+>." }
  { name = "|+|", owner = Semigroup, syntax = semigroup, receiver = "A", params = ["A"], result = "A"
    requires { A = Semigroup }, rank = 55, insert = "|+| |"
    doc = "Combine two values with their Semigroup."
    example = "Map(\"a\" -> 1) |+| Map(\"a\" -> 2)   // Map(a -> 3)" }
  { name = combine, owner = Semigroup, syntax = semigroup, receiver = "A", params = ["A"], result = "A"
    requires { A = Semigroup }, rank = 35
    doc = "Named alias of |+|." }
  { name = "===", owner = Eq, syntax = eq, receiver = "A", params = ["A"], result = "Boolean"
    requires { A = Eq }, rank = 50, insert = "=== |"
    doc = "Type-safe equality: comparing values of different types does not compile." }
  { name = "=!=", owner = Eq, syntax = eq, receiver = "A", params = ["A"], result = "Boolean"
    requires { A = Eq }, rank = 40, insert = "=!= |"
    doc = "Type-safe inequality." }
  { name = show, owner = Show, syntax = show, receiver = "A", result = "String"
    requires { A = Show }, rank = 45, insert = "show"
    doc = "Render with Show instead of toString." }

  # ---------------------------------------------------------------- Option / Either / List specific
  { name = toNel, owner = List, syntax = list, receiver = "List[A]", result = "Option[NonEmptyList[A]]"
    rank = 60, insert = "toNel"
    doc = "Some(NonEmptyList) when the list has elements, None when empty." }
  { name = groupByNel, owner = List, syntax = list, receiver = "List[A]", params = ["A => B"], result = "SortedMap[B, NonEmptyList[A]]"
    rank = 40
    doc = "groupBy with NonEmptyList groups (needs Order[B])." }
  { name = liftTo, owner = Option, syntax = option, receiver = "Option[A]", params = ["E"], result = "F[A]"
    requires { F = ApplicativeError }, rank = 65, insert = "liftTo[|]()"
    doc = "Lift into F, raising the given error for None."
    example = "maybeUser.liftTo[IO](UserNotFound(id))" }
  { name = toValidNel, owner = Option, syntax = option, receiver = "Option[A]", params = ["E"], result = "ValidatedNel[E, A]"
    rank = 45
    doc = "Valid when Some, invalid with the given error when None." }
  { name = toRightNel, owner = Option, syntax = option, receiver = "Option[A]", params = ["E"], result = "Either[NonEmptyList[E], A]"
    rank = 35
    doc = "Right when Some, Left(NonEmptyList(e)) when None." }
  { name = orEmpty, owner = Option, syntax = option, receiver = "Option[A]", result = "A"
    requires { A = Monoid }, rank = 45, insert = "orEmpty"
    doc = "The value, or Monoid.empty when None." }
  { name = leftMap, owner = Either, syntax = either, receiver = "Either[E, A]", params = ["E => C"], result = "Either[C, A]"
    rank = 75
    doc = "Transform the Left side." }
  { name = liftTo, owner = Either, variant = either, syntax = either, receiver = "Either[E, A]", result = "F[A]"
    requires { F = ApplicativeError }, rank = 60, insert = "liftTo[|]"
    doc = "Lift into F, raising the Left (must be a Throwable for IO)."
    example = "decode[User](json).liftTo[IO]" }
  { name = toValidatedNel, owner = Either, syntax = either, receiver = "Either[E, A]", result = "ValidatedNel[E, A]"
    rank = 50, insert = "toValidatedNel"
    doc = "Switch to error accumulation." }
  { name = toEitherT, owner = Either, syntax = either, receiver = "Either[E, A]", result = "EitherT[F, E, A]"
    requires { F = Applicative }, rank = 55, insert = "toEitherT[|]"
    doc = "Wrap into EitherT[F, E, A]." }
  { name = valueOr, owner = Either, syntax = either, receiver = "Either[E, A]", params = ["E => A"], result = "A"
    rank = 40
    doc = "The Right value, or compute one from the Left." }
  { name = leftFlatMap, owner = Either, syntax = either, receiver = "Either[E, A]", params = ["E => Either[C, A]"], result = "Either[C, A]"
    rank = 30
    doc = "flatMap on the Left side." }
  { name = leftTraverse, owner = Either, syntax = either, receiver = "Either[E, A]", params = ["E => G[C]"], result = "G[Either[C, A]]"
    requires { G = Applicative }, rank = 25
    doc = "traverse on the Left side." }
  { name = bimap, owner = Bifunctor, syntax = bifunctor, receiver = "F[E, A]", params = ["E => C", "A => B"], result = "F[C, B]"
    requires { F = Bifunctor }, rank = 40, insert = "bimap(|, )"
    doc = "Transform both sides at once." }
]
