# cats.data (cats 2.x): more EitherT / OptionT / Kleisli constructors and methods, NonEmptyList / NonEmptyChain /
# NonEmptyVector, Validated, Ior, Chain and State.
library = cats-core
kind = companion

ops = [
  # ---------------------------------------------------------------- EitherT
  { name = pure, owner = EitherT, params = ["A"], result = "EitherT[F, E, A]", rank = 50, insert = "pure[|]()"
    doc = "A successful EitherT from a plain value."
    example = "EitherT.pure[IO, AppError](user)" }
  { name = left, owner = EitherT, params = ["F[E]"], result = "EitherT[F, E, A]", rank = 40
    doc = "A failed EitherT from an effect producing the error." }
  { name = right, owner = EitherT, params = ["F[A]"], result = "EitherT[F, E, A]", rank = 40
    doc = "A successful EitherT from an effect (same as liftF)." }
  { name = fromOptionM, owner = EitherT, params = ["F[Option[A]]", "F[E]"], result = "EitherT[F, E, A]", rank = 20, insert = "fromOptionM(|, )"
    doc = "fromOptionF with an effectful error." }
  { name = liftK, owner = EitherT, result = "FunctionK[F, EitherT[F, E, *]]", rank = 15, insert = "liftK"
    doc = "F ~> EitherT[F, E, *], for mapK on algebras." }
  { name = leftMap, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", params = ["E => D"], result = "EitherT[F, D, A]", rank = 55
    doc = "Transform the error." }
  { name = bimap, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", params = ["E => D", "A => B"], result = "EitherT[F, D, B]"
    rank = 35, insert = "bimap(|, )"
    doc = "Transform both the error and the value." }
  { name = flatMapF, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", params = ["A => F[Either[E, B]]"]
    result = "EitherT[F, E, B]", rank = 50
    doc = "flatMap with a function returning F[Either[E, B]] (no EitherT wrapping needed)." }
  { name = fold, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", params = ["E => C", "A => C"], result = "F[C]", rank = 45
    insert = "fold(|, )"
    doc = "Collapse both sides into F[C]." }
  { name = foldF, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", params = ["E => F[C]", "A => F[C]"], result = "F[C]", rank = 35
    insert = "foldF(|, )"
    doc = "fold with effectful handlers." }
  { name = getOrElse, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", params = ["A"], result = "F[A]", rank = 40
    doc = "The value, or a default on Left." }
  { name = getOrElseF, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", params = ["F[A]"], result = "F[A]", rank = 30
    doc = "The value, or a default effect on Left." }
  { name = getOrRaise, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", params = ["Throwable"], result = "F[A]", rank = 30
    doc = "The value, or raise the given error in F on Left." }
  { name = valueOr, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", params = ["E => A"], result = "F[A]", rank = 30
    doc = "The value, or one computed from the error." }
  { name = valueOrF, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", params = ["E => F[A]"], result = "F[A]", rank = 20
    doc = "valueOr with an effectful handler." }
  { name = rethrowT, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", result = "F[A]", rank = 35, insert = "rethrowT"
    doc = "Raise the Left into F's error channel (E must fit F's error type, typically Throwable)." }
  { name = recover, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", params = ["PartialFunction[E, A]"], result = "EitherT[F, E, A]"
    rank = 25, insert = "recover { case | => }"
    doc = "Turn some errors into values." }
  { name = recoverWith, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", params = ["PartialFunction[E, EitherT[F, E, A]]"]
    result = "EitherT[F, E, A]", rank = 20, insert = "recoverWith { case | => }"
    doc = "Recover from some errors with another EitherT." }
  { name = leftFlatMap, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", params = ["E => EitherT[F, D, A]"]
    result = "EitherT[F, D, A]", rank = 20
    doc = "flatMap on the error side." }
  { name = semiflatTap, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", params = ["A => F[C]"], result = "EitherT[F, E, A]"
    rank = 30
    doc = "Run an effect on the value, keep the value." }
  { name = ensure, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", params = ["E", "A => Boolean"], result = "EitherT[F, E, A]"
    rank = 25, insert = "ensure(|)()"
    doc = "Fail with the error if the predicate does not hold." }
  { name = swap, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", result = "EitherT[F, A, E]", rank = 15, insert = "swap"
    doc = "Swap the sides." }
  { name = toOption, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", result = "OptionT[F, A]", rank = 25, insert = "toOption"
    doc = "Drop the error: OptionT." }
  { name = orElse, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", params = ["EitherT[F, E, A]"], result = "EitherT[F, E, A]"
    rank = 20
    doc = "Try another EitherT on Left." }
  { name = isRight, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", result = "F[Boolean]", rank = 15, insert = "isRight"
    doc = "Whether the result is a Right." }
  { name = merge, owner = EitherT, kind = method, receiver = "EitherT[F, A, A]", result = "F[A]", rank = 15, insert = "merge"
    doc = "Collapse an EitherT whose sides have the same type." }

  # ---------------------------------------------------------------- OptionT
  { name = pure, owner = OptionT, params = ["A"], result = "OptionT[F, A]", rank = 45, insert = "pure[|]()"
    doc = "A defined OptionT from a plain value." }
  { name = when, owner = OptionT, params = ["Boolean", "A"], result = "OptionT[F, A]", rank = 25, insert = "when[|](, )"
    doc = "Some(a) when the condition holds, otherwise None." }
  { name = unlessF, owner = OptionT, params = ["Boolean", "F[A]"], result = "OptionT[F, A]", rank = 15, insert = "unlessF(|)()"
    doc = "None when the condition holds, otherwise the effect's value." }
  { name = liftK, owner = OptionT, result = "FunctionK[F, OptionT[F, *]]", rank = 15, insert = "liftK"
    doc = "F ~> OptionT[F, *]." }
  { name = getOrElse, owner = OptionT, kind = method, receiver = "OptionT[F, A]", params = ["A"], result = "F[A]", rank = 45
    doc = "The value, or a default." }
  { name = semiflatMap, owner = OptionT, kind = method, receiver = "OptionT[F, A]", params = ["A => F[B]"], result = "OptionT[F, B]", rank = 45
    doc = "flatMap with a plain effect." }
  { name = subflatMap, owner = OptionT, kind = method, receiver = "OptionT[F, A]", params = ["A => Option[B]"], result = "OptionT[F, B]"
    rank = 35
    doc = "flatMap with a pure Option." }
  { name = flatMapF, owner = OptionT, kind = method, receiver = "OptionT[F, A]", params = ["A => F[Option[B]]"], result = "OptionT[F, B]"
    rank = 40
    doc = "flatMap with a function returning F[Option[B]]." }
  { name = fold, owner = OptionT, kind = method, receiver = "OptionT[F, A]", params = ["B", "A => B"], result = "F[B]", rank = 35
    insert = "fold(|)()"
    doc = "Collapse to F[B] with a default for None." }
  { name = foldF, owner = OptionT, kind = method, receiver = "OptionT[F, A]", params = ["F[B]", "A => F[B]"], result = "F[B]", rank = 25
    insert = "foldF(|)()"
    doc = "fold with effects." }
  { name = cata, owner = OptionT, kind = method, receiver = "OptionT[F, A]", params = ["B", "A => B"], result = "F[B]", rank = 15
    insert = "cata(|, )"
    doc = "fold with both arguments in one list." }
  { name = isDefined, owner = OptionT, kind = method, receiver = "OptionT[F, A]", result = "F[Boolean]", rank = 25, insert = "isDefined"
    doc = "Whether there is a value." }
  { name = toLeft, owner = OptionT, kind = method, receiver = "OptionT[F, A]", params = ["R"], result = "EitherT[F, A, R]", rank = 20
    doc = "EitherT with the value on the left (or the default on the right)." }
  { name = orElse, owner = OptionT, kind = method, receiver = "OptionT[F, A]", params = ["OptionT[F, A]"], result = "OptionT[F, A]", rank = 25
    doc = "Try another OptionT on None." }
  { name = orElseF, owner = OptionT, kind = method, receiver = "OptionT[F, A]", params = ["F[Option[A]]"], result = "OptionT[F, A]", rank = 20
    doc = "Try an F[Option[A]] on None." }
  { name = filter, owner = OptionT, kind = method, receiver = "OptionT[F, A]", params = ["A => Boolean"], result = "OptionT[F, A]", rank = 25
    doc = "None if the predicate fails." }
  { name = collect, owner = OptionT, kind = method, receiver = "OptionT[F, A]", params = ["PartialFunction[A, B]"], result = "OptionT[F, B]"
    rank = 15, insert = "collect { case | => }"
    doc = "filter and map with a partial function." }
  { name = getOrRaise, owner = OptionT, kind = method, receiver = "OptionT[F, A]", params = ["Throwable"], result = "F[A]", rank = 30
    doc = "The value, or raise the given error in F." }
  { name = semiflatTap, owner = OptionT, kind = method, receiver = "OptionT[F, A]", params = ["A => F[B]"], result = "OptionT[F, A]", rank = 25
    doc = "Run an effect on the value, keep the value." }
  { name = flatTapNone, owner = OptionT, kind = method, receiver = "OptionT[F, A]", params = ["F[B]"], result = "OptionT[F, A]", rank = 15
    doc = "Run an effect when there is no value (logging)." }

  # ---------------------------------------------------------------- Kleisli
  { name = pure, owner = Kleisli, params = ["B"], result = "Kleisli[F, A, B]", rank = 30, insert = "pure[|]()"
    doc = "A Kleisli that ignores its input." }
  { name = fromFunction, owner = Kleisli, params = ["A => B"], result = "Kleisli[F, A, B]", rank = 20, insert = "fromFunction[|]()"
    doc = "Lift a pure function." }
  { name = liftK, owner = Kleisli, result = "FunctionK[F, Kleisli[F, A, *]]", rank = 10, insert = "liftK"
    doc = "F ~> Kleisli[F, A, *]." }
  { name = run, owner = Kleisli, kind = method, receiver = "Kleisli[F, A, B]", result = "A => F[B]", rank = 60, insert = "run"
    doc = "The underlying function." }
  { name = andThen, owner = Kleisli, kind = method, receiver = "Kleisli[F, A, B]", params = ["Kleisli[F, B, C]"], result = "Kleisli[F, A, C]"
    rank = 35
    doc = "Compose left to right." }
  { name = local, owner = Kleisli, kind = method, receiver = "Kleisli[F, A, B]", params = ["Z => A"], result = "Kleisli[F, Z, B]", rank = 30
    doc = "Adapt the input (contramap)." }
  { name = mapF, owner = Kleisli, kind = method, receiver = "Kleisli[F, A, B]", params = ["F[B] => G[C]"], result = "Kleisli[G, A, C]", rank = 20
    doc = "Transform the effect of the result." }
  { name = flatMapF, owner = Kleisli, kind = method, receiver = "Kleisli[F, A, B]", params = ["B => F[C]"], result = "Kleisli[F, A, C]", rank = 30
    doc = "flatMap with a plain effect." }

  # ---------------------------------------------------------------- NonEmptyList / NonEmptyChain / NonEmptyVector
  { name = fromListUnsafe, owner = NonEmptyList, params = ["List[A]"], result = "NonEmptyList[A]", rank = 15
    doc = "Throws on an empty list. Prefer fromList or toNel." }
  { name = fromFoldable, owner = NonEmptyList, params = ["F[A]"], result = "Option[NonEmptyList[A]]", requires { F = Foldable }, rank = 15
    doc = "From any Foldable, None if empty." }
  { name = ofInitLast, owner = NonEmptyList, params = ["List[A]", "A"], result = "NonEmptyList[A]", rank = 10, insert = "ofInitLast(|, )"
    doc = "From an init list and a last element." }
  { name = head, owner = NonEmptyList, kind = method, receiver = "NonEmptyList[A]", result = "A", rank = 50, insert = "head"
    doc = "The first element (always safe)." }
  { name = tail, owner = NonEmptyList, kind = method, receiver = "NonEmptyList[A]", result = "List[A]", rank = 35, insert = "tail"
    doc = "All elements but the first." }
  { name = toList, owner = NonEmptyList, kind = method, receiver = "NonEmptyList[A]", result = "List[A]", rank = 50, insert = "toList"
    doc = "Forget non-emptiness." }
  { name = concatNel, owner = NonEmptyList, kind = method, receiver = "NonEmptyList[A]", params = ["NonEmptyList[A]"], result = "NonEmptyList[A]"
    rank = 25
    doc = "Append another NonEmptyList." }
  { name = distinct, owner = NonEmptyList, kind = method, receiver = "NonEmptyList[A]", result = "NonEmptyList[A]", requires { A = Order }
    rank = 25, insert = "distinct"
    doc = "Remove duplicates (needs Order[A])." }
  { name = groupByNem, owner = NonEmptyList, kind = method, receiver = "NonEmptyList[A]", params = ["A => K"]
    result = "NonEmptyMap[K, NonEmptyList[A]]", requires { K = Order }, rank = 20
    doc = "Group into a NonEmptyMap (needs Order[K])." }
  { name = zipWithIndex, owner = NonEmptyList, kind = method, receiver = "NonEmptyList[A]", result = "NonEmptyList[(A, Int)]", rank = 20
    insert = "zipWithIndex"
    doc = "Pair each element with its index." }
  { name = one, owner = NonEmptyChain, params = ["A"], result = "NonEmptyChain[A]", rank = 40
    doc = "A single-element NonEmptyChain." }
  { name = of, owner = NonEmptyChain, params = ["A", "A"], result = "NonEmptyChain[A]", rank = 35
    doc = "From one or more elements." }
  { name = fromSeq, owner = NonEmptyChain, params = ["Seq[A]"], result = "Option[NonEmptyChain[A]]", rank = 25
    doc = "From a Seq, None if empty." }
  { name = fromChain, owner = NonEmptyChain, params = ["Chain[A]"], result = "Option[NonEmptyChain[A]]", rank = 15
    doc = "From a Chain, None if empty." }
  { name = fromNonEmptyList, owner = NonEmptyChain, params = ["NonEmptyList[A]"], result = "NonEmptyChain[A]", rank = 20
    doc = "From a NonEmptyList." }
  { name = one, owner = NonEmptyVector, params = ["A"], result = "NonEmptyVector[A]", rank = 30
    doc = "A single-element NonEmptyVector." }
  { name = of, owner = NonEmptyVector, params = ["A", "A"], result = "NonEmptyVector[A]", rank = 30
    doc = "From one or more elements." }
  { name = fromVector, owner = NonEmptyVector, params = ["Vector[A]"], result = "Option[NonEmptyVector[A]]", rank = 25
    doc = "From a Vector, None if empty." }

  # ---------------------------------------------------------------- Validated / Ior / Chain / State
  { name = valid, owner = Validated, variant = companion, params = ["A"], result = "Validated[E, A]", rank = 40
    doc = "A valid value. Prefer a.valid / a.validNel." }
  { name = invalid, owner = Validated, variant = companion, params = ["E"], result = "Validated[E, A]", rank = 35
    doc = "An invalid value." }
  { name = validNel, owner = Validated, variant = companion, params = ["A"], result = "ValidatedNel[E, A]", rank = 40
    doc = "A valid value whose errors accumulate in a NonEmptyList." }
  { name = invalidNel, owner = Validated, variant = companion, params = ["E"], result = "ValidatedNel[E, A]", rank = 45
    doc = "A single error, accumulating in a NonEmptyList." }
  { name = catchNonFatal, owner = Validated, params = ["A"], result = "Validated[Throwable, A]", rank = 25
    doc = "Evaluate, catching non-fatal exceptions as Invalid." }
  { name = fromEither, owner = Validated, params = ["Either[E, A]"], result = "Validated[E, A]", rank = 30
    doc = "From an Either. Prefer either.toValidated." }
  { name = fromOption, owner = Validated, params = ["Option[A]", "E"], result = "Validated[E, A]", rank = 25, insert = "fromOption(|, )"
    doc = "From an Option with an error for None." }
  { name = fromTry, owner = Validated, params = ["Try[A]"], result = "Validated[Throwable, A]", rank = 20
    doc = "From a Try." }
  { name = cond, owner = Validated, params = ["Boolean", "A", "E"], result = "Validated[E, A]", rank = 30, insert = "cond(|, , )"
    doc = "Valid(a) if the test holds, otherwise Invalid(e)." }
  { name = condNel, owner = Validated, params = ["Boolean", "A", "E"], result = "ValidatedNel[E, A]", rank = 35, insert = "condNel(|, , )"
    doc = "cond, accumulating errors in a NonEmptyList (form validation)." }
  { name = condNec, owner = Validated, params = ["Boolean", "A", "E"], result = "ValidatedNec[E, A]", rank = 25, insert = "condNec(|, , )"
    doc = "cond, accumulating errors in a NonEmptyChain." }
  { name = toEither, owner = Validated, kind = method, receiver = "Validated[E, A]", result = "Either[E, A]", rank = 45, insert = "toEither"
