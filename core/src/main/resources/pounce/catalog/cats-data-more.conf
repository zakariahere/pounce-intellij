  { name = andThen, owner = Validated, kind = method, receiver = "Validated[E, A]", params = ["A => Validated[E, B]"], result = "Validated[E, B]"
    rank = 35
    doc = "Sequential validation: the next step only runs on Valid (no accumulation)." }
  { name = fold, owner = Validated, kind = method, receiver = "Validated[E, A]", params = ["E => B", "A => B"], result = "B", rank = 35
    insert = "fold(|, )"
    doc = "Collapse both cases." }
  { name = getOrElse, owner = Validated, kind = method, receiver = "Validated[E, A]", params = ["A"], result = "A", rank = 30
    doc = "The value, or a default." }
  { name = valueOr, owner = Validated, kind = method, receiver = "Validated[E, A]", params = ["E => A"], result = "A", rank = 25
    doc = "The value, or one computed from the errors." }
  { name = toOption, owner = Validated, kind = method, receiver = "Validated[E, A]", result = "Option[A]", rank = 30, insert = "toOption"
    doc = "Drop the errors." }
  { name = isValid, owner = Validated, kind = method, receiver = "Validated[E, A]", result = "Boolean", rank = 25, insert = "isValid"
    doc = "Whether it is Valid." }
  { name = leftMap, owner = Validated, kind = method, receiver = "Validated[E, A]", params = ["E => D"], result = "Validated[D, A]", rank = 35
    doc = "Transform the errors." }
  { name = both, owner = Ior, params = ["A", "B"], result = "Ior[A, B]", rank = 30, insert = "both(|, )"
    doc = "A result with warnings: both sides present." }
  { name = left, owner = Ior, params = ["A"], result = "Ior[A, B]", rank = 30
    doc = "Only the left (failure) side." }
  { name = right, owner = Ior, params = ["B"], result = "Ior[A, B]", rank = 30
    doc = "Only the right (success) side." }
  { name = fromEither, owner = Ior, params = ["Either[A, B]"], result = "Ior[A, B]", rank = 20
    doc = "From an Either." }
  { name = bothNel, owner = Ior, params = ["A", "B"], result = "IorNel[A, B]", rank = 15, insert = "bothNel(|, )"
    doc = "both, with the left side in a NonEmptyList (warnings)." }
  { name = one, owner = Chain, params = ["A"], result = "Chain[A]", rank = 35
    doc = "A single-element Chain." }
  { name = empty, owner = Chain, result = "Chain[A]", rank = 30, insert = "empty"
    doc = "The empty Chain." }
  { name = fromSeq, owner = Chain, params = ["Seq[A]"], result = "Chain[A]", rank = 35
    doc = "From a Seq (constant-time wrap)." }
  { name = fromOption, owner = Chain, params = ["Option[A]"], result = "Chain[A]", rank = 20
    doc = "Zero or one element." }
  { name = concat, owner = Chain, params = ["Chain[A]", "Chain[A]"], result = "Chain[A]", rank = 15, insert = "concat(|, )"
    doc = "Constant-time append." }
  { name = get, owner = State, result = "State[S, S]", rank = 40, insert = "get[|]"
    doc = "Read the state." }
  { name = set, owner = State, params = ["S"], result = "State[S, Unit]", rank = 35
    doc = "Replace the state." }
  { name = modify, owner = State, params = ["S => S"], result = "State[S, Unit]", rank = 40
    doc = "Transform the state." }
  { name = inspect, owner = State, params = ["S => T"], result = "State[S, T]", rank = 35
