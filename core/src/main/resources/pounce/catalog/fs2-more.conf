# fs2 3.x: more Stream constructors and combinators, and the `.compile` terminal operations (Stream.CompileOps).
library = fs2
kind = companion

ops = [
  # ---------------------------------------------------------------- Stream constructors
  { name = empty, owner = Stream, result = "Stream[Pure, Nothing]", rank = 35, insert = "empty"
    doc = "The empty stream." }
  { name = eval_, owner = Stream, params = ["F[A]"], result = "Stream[F, Nothing]", rank = 30
    doc = "Run an effect for its side effect, emitting nothing." }
  { name = exec, owner = Stream, params = ["F[Unit]"], result = "Stream[F, Nothing]", rank = 30
    doc = "Run an F[Unit], emitting nothing." }
  { name = fromIterator, owner = Stream, params = ["Iterator[A]", "Int"], result = "Stream[F, A]", rank = 30, insert = "fromIterator[|](, )"
    doc = "Stream an Iterator (suspended, chunked)." }
  { name = fromBlockingIterator, owner = Stream, params = ["Iterator[A]", "Int"], result = "Stream[F, A]", rank = 25
    insert = "fromBlockingIterator[|](, )"
    doc = "Stream a blocking Iterator on the blocking pool." }
  { name = iterate, owner = Stream, params = ["A", "A => A"], result = "Stream[Pure, A]", rank = 25, insert = "iterate(|)()"
    doc = "start, f(start), f(f(start)), ..." }
  { name = iterateEval, owner = Stream, params = ["A", "A => F[A]"], result = "Stream[F, A]", rank = 25, insert = "iterateEval(|)()"
    doc = "iterate with an effectful step." }
  { name = range, owner = Stream, params = ["Int", "Int"], result = "Stream[Pure, Int]", rank = 40, insert = "range(|, )"
    doc = "Integers from start (inclusive) to stop (exclusive)." }
  { name = repeatEval, owner = Stream, params = ["F[A]"], result = "Stream[F, A]", rank = 40
    doc = "Run the effect forever, emitting each result (polling)." }
  { name = fixedRate, owner = Stream, params = ["FiniteDuration"], result = "Stream[F, Unit]", rank = 35, insert = "fixedRate[|]()"
    doc = "Emit unit at a fixed rate (ticks)." }
  { name = fixedDelay, owner = Stream, params = ["FiniteDuration"], result = "Stream[F, Unit]", rank = 30, insert = "fixedDelay[|]()"
    doc = "Emit unit with a fixed delay between elements." }
  { name = bracket, owner = Stream, params = ["F[R]", "R => F[Unit]"], result = "Stream[F, R]", rank = 35, insert = "bracket(|)(r => )"
    doc = "Acquire a resource for the lifetime of the stream." }
  { name = unfold, owner = Stream, params = ["S", "S => Option[(A, S)]"], result = "Stream[Pure, A]", rank = 20, insert = "unfold(|)()"
    doc = "Build a stream from a state machine; None ends it." }
  { name = unfoldEval, owner = Stream, params = ["S", "S => F[Option[(A, S)]]"], result = "Stream[F, A]", rank = 25, insert = "unfoldEval(|)()"
    doc = "unfold with an effectful step (pagination)." }
  { name = raiseError, owner = Stream, params = ["Throwable"], result = "Stream[F, Nothing]", rank = 30, insert = "raiseError[|]()"
    doc = "A failed stream." }
  { name = sleep, owner = Stream, params = ["FiniteDuration"], result = "Stream[F, Unit]", rank = 25, insert = "sleep[|]()"
    doc = "Emit unit after a delay." }
  { name = constant, owner = Stream, params = ["A"], result = "Stream[Pure, A]", rank = 15
    doc = "Emit the same value forever." }
  { name = chunk, owner = Stream, params = ["Chunk[A]"], result = "Stream[Pure, A]", rank = 20
    doc = "A stream of one chunk." }
  { name = fromQueueUnterminated, owner = Stream, params = ["Queue[F, A]"], result = "Stream[F, A]", rank = 25
    doc = "Dequeue forever from a cats-effect Queue." }
  { name = never, owner = Stream, result = "Stream[F, Nothing]", rank = 10, insert = "never[|]"
    doc = "A stream that never emits nor terminates." }
  { name = retry, owner = Stream, params = ["F[A]", "FiniteDuration", "FiniteDuration => FiniteDuration", "Int"], result = "Stream[F, A]"
    rank = 15, insert = "retry(|, , , )"
    doc = "Retry an effect with a delay and a back-off function, up to maxAttempts." }

  # ---------------------------------------------------------------- Stream combinators
  { name = through, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["Pipe[F, A, B]"], result = "Stream[F, B]", rank = 50
    doc = "Apply a Pipe (Stream[F, A] => Stream[F, B])." }
  { name = evalFilter, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["A => F[Boolean]"], result = "Stream[F, A]", rank = 30
    doc = "Keep the elements for which the effect returns true." }
  { name = parEvalMapUnbounded, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["A => F[B]"], result = "Stream[F, B]"
    rank = 25
    doc = "evalMap with unbounded parallelism, preserving order." }
  { name = chunkN, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["Int"], result = "Stream[F, Chunk[A]]", rank = 30
    doc = "Group into chunks of n (the last one may be smaller)." }
  { name = chunks, owner = Stream, kind = method, receiver = "Stream[F, A]", result = "Stream[F, Chunk[A]]", rank = 25, insert = "chunks"
    doc = "Expose the underlying chunks." }
  { name = merge, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["Stream[F, A]"], result = "Stream[F, A]", rank = 40
    doc = "Interleave two streams running concurrently." }
  { name = interruptWhen, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["F[Either[Throwable, Unit]]"]
    result = "Stream[F, A]", rank = 25
    doc = "Stop the stream when the effect completes (or a signal turns true)." }
  { name = interruptAfter, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["FiniteDuration"], result = "Stream[F, A]"
    rank = 30
    doc = "Stop the stream after a duration." }
  { name = handleErrorWith, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["Throwable => Stream[F, A]"]
    result = "Stream[F, A]", rank = 45
    doc = "Continue with another stream on error." }
  { name = attempt, owner = Stream, kind = method, receiver = "Stream[F, A]", result = "Stream[F, Either[Throwable, A]]", rank = 35
    insert = "attempt"
    doc = "Emit Right for elements and a final Left on error." }
  { name = onFinalize, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["F[Unit]"], result = "Stream[F, A]", rank = 30
    doc = "Run an effect when the stream terminates (success, error, interruption)." }
  { name = metered, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["FiniteDuration"], result = "Stream[F, A]", rank = 30
    doc = "Emit at most one element per period (rate limiting)." }
  { name = debounce, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["FiniteDuration"], result = "Stream[F, A]", rank = 20
    doc = "Emit the latest element after a quiet period." }
  { name = zip, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["Stream[F, B]"], result = "Stream[F, (A, B)]", rank = 30
    doc = "Pair elements; stops with the shorter stream." }
  { name = zipWithIndex, owner = Stream, kind = method, receiver = "Stream[F, A]", result = "Stream[F, (A, Long)]", rank = 30
    insert = "zipWithIndex"
    doc = "Pair each element with its index." }
  { name = scan, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["B", "(B, A) => B"], result = "Stream[F, B]", rank = 25
    insert = "scan(|)()"
    doc = "Running fold, emitting every intermediate state." }
  { name = fold, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["B", "(B, A) => B"], result = "Stream[F, B]", rank = 20
    insert = "fold(|)()"
    doc = "Fold to a single-element stream." }
  { name = take, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["Long"], result = "Stream[F, A]", rank = 40
    doc = "The first n elements." }
  { name = drop, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["Long"], result = "Stream[F, A]", rank = 25
    doc = "Skip the first n elements." }
  { name = takeWhile, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["A => Boolean"], result = "Stream[F, A]", rank = 25
    doc = "Elements until the predicate fails." }
  { name = repeat, owner = Stream, kind = method, receiver = "Stream[F, A]", result = "Stream[F, A]", rank = 30, insert = "repeat"
    doc = "Restart the stream forever when it ends." }
  { name = broadcastThrough, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["Pipe[F, A, B]"], result = "Stream[F, B]"
    rank = 15
    doc = "Send every element to all pipes, merge their outputs." }
  { name = debug, owner = Stream, kind = method, receiver = "Stream[F, A]", result = "Stream[F, A]", rank = 15, insert = "debug()"
    doc = "Print each element. Development only." }
  { name = drain, owner = Stream, kind = method, receiver = "Stream[F, A]", result = "Stream[F, Nothing]", rank = 35, insert = "drain"
    doc = "Run for effects, emit nothing (not the same as .compile.drain)." }
  { name = foreach, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["A => F[Unit]"], result = "Stream[F, Nothing]", rank = 30
    doc = "Run an effect per element, emit nothing." }
  { name = rethrow, owner = Stream, kind = method, receiver = "Stream[F, Either[Throwable, B]]", result = "Stream[F, B]", rank = 20
    insert = "rethrow"
    doc = "Fail the stream on the first Left." }
  { name = buffer, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["Int"], result = "Stream[F, A]", rank = 15
    doc = "Buffer n elements." }
  { name = prefetch, owner = Stream, kind = method, receiver = "Stream[F, A]", result = "Stream[F, A]", rank = 15, insert = "prefetch"
    doc = "Evaluate the next chunk while the current one is consumed." }
  { name = timeout, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["FiniteDuration"], result = "Stream[F, A]", rank = 25
    doc = "Fail with TimeoutException if the whole stream takes longer." }
  { name = parJoin, owner = Stream, kind = method, receiver = "Stream[F, Stream[F, A]]", params = ["Int"], result = "Stream[F, A]", rank = 35
    doc = "Run at most n inner streams concurrently, merging their output." }
  { name = parJoinUnbounded, owner = Stream, kind = method, receiver = "Stream[F, Stream[F, A]]", result = "Stream[F, A]", rank = 25
    insert = "parJoinUnbounded"
    doc = "Run all inner streams concurrently." }

  # ---------------------------------------------------------------- .compile (Stream.CompileOps)
  { name = drain, owner = CompileOps, kind = method, receiver = "Stream.CompileOps[F, G, A]", result = "G[Unit]", rank = 70, insert = "drain"
    doc = "Run the stream for its effects." }
  { name = toList, owner = CompileOps, kind = method, receiver = "Stream.CompileOps[F, G, A]", result = "G[List[A]]", rank = 60, insert = "toList"
    doc = "Run the stream and collect all elements (must be finite)." }
  { name = toVector, owner = CompileOps, kind = method, receiver = "Stream.CompileOps[F, G, A]", result = "G[Vector[A]]", rank = 40
    insert = "toVector"
    doc = "Run the stream and collect into a Vector." }
  { name = last, owner = CompileOps, kind = method, receiver = "Stream.CompileOps[F, G, A]", result = "G[Option[A]]", rank = 40, insert = "last"
    doc = "Run the stream and keep the last element." }
  { name = lastOrError, owner = CompileOps, kind = method, receiver = "Stream.CompileOps[F, G, A]", result = "G[A]", rank = 50
    insert = "lastOrError"
    doc = "The last element; fails on an empty stream." }
  { name = onlyOrError, owner = CompileOps, kind = method, receiver = "Stream.CompileOps[F, G, A]", result = "G[A]", rank = 35
    insert = "onlyOrError"
    doc = "The single element; fails if there are zero or several." }
  { name = fold, owner = CompileOps, kind = method, receiver = "Stream.CompileOps[F, G, A]", params = ["B", "(B, A) => B"], result = "G[B]"
    rank = 25, insert = "fold(|)()"
    doc = "Run the stream, folding the elements." }
  { name = count, owner = CompileOps, kind = method, receiver = "Stream.CompileOps[F, G, A]", result = "G[Long]", rank = 30, insert = "count"
    doc = "Run the stream and count the elements." }
  { name = resource, owner = CompileOps, kind = method, receiver = "Stream.CompileOps[F, G, A]"
    result = "Stream.CompileOps[F, Resource[G, *], A]", rank = 30, insert = "resource"
    doc = "Compile into a Resource: resources acquired by the stream live as long as the Resource." }
  { name = string, owner = CompileOps, kind = method, receiver = "Stream.CompileOps[F, G, String]", result = "G[String]", rank = 20
    insert = "string"
    doc = "Concatenate a stream of strings." }
]
