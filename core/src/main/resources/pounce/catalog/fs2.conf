# fs2 streams.
library = fs2
kind = companion

ops = [
  { name = eval, owner = Stream, params = ["F[A]"], result = "Stream[F, A]", rank = 75
    doc = "A single-element stream from an effect." }
  { name = emit, owner = Stream, params = ["A"], result = "Stream[Pure, A]", rank = 60
    doc = "A single-element pure stream." }
  { name = emits, owner = Stream, params = ["Seq[A]"], result = "Stream[Pure, A]", rank = 60
    doc = "A pure stream from a collection." }
  { name = resource, owner = Stream, params = ["Resource[F, A]"], result = "Stream[F, A]", rank = 55
    doc = "A stream that acquires a resource for its lifetime." }
  { name = awakeEvery, owner = Stream, params = ["FiniteDuration"], result = "Stream[F, FiniteDuration]", rank = 45, insert = "awakeEvery[|]()"
    doc = "Emit elapsed time at a fixed rate." }
  { name = evalMap, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["A => F[B]"], result = "Stream[F, B]", rank = 70
    doc = "Run an effect per element." }
  { name = evalTap, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["A => F[B]"], result = "Stream[F, A]", rank = 55
    doc = "Run an effect per element, keep the element." }
  { name = parEvalMap, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["Int", "A => F[B]"], result = "Stream[F, B]", rank = 55, insert = "parEvalMap(|)()"
    doc = "evalMap with bounded parallelism, preserving order." }
  { name = parEvalMapUnordered, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["Int", "A => F[B]"], result = "Stream[F, B]", rank = 45, insert = "parEvalMapUnordered(|)()"
    doc = "evalMap with bounded parallelism, results in completion order." }
  { name = compile, owner = Stream, kind = method, receiver = "Stream[F, A]", result = "Stream.CompileOps[F, F, A]", rank = 60, insert = "compile"
    doc = "Interpret the stream: .compile.drain, .toList, .lastOrError, .resource ..." }
  { name = groupWithin, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["Int", "FiniteDuration"], result = "Stream[F, Chunk[A]]", rank = 40, insert = "groupWithin(|)()"
    doc = "Batch by size or time, whichever comes first." }
  { name = concurrently, owner = Stream, kind = method, receiver = "Stream[F, A]", params = ["Stream[F, B]"], result = "Stream[F, A]", rank = 35
    doc = "Run another stream in the background for the lifetime of this one." }
]
