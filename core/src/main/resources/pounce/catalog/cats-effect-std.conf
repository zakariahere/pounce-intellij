# cats.effect.std (Cats Effect 3.5 / 3.6): Queue, Semaphore, Supervisor, Dispatcher, Random, Console, latches, Mutex,
# AtomicCell, Hotswap, UUIDGen. Companion constructors plus the methods worth documenting.
library = cats-effect
kind = companion

ops = [
  # ---------------------------------------------------------------- Queue
  { name = bounded, owner = Queue, params = ["Int"], result = "F[Queue[F, A]]", rank = 60, insert = "bounded[|]()"
    doc = "A queue with back-pressure: offer waits when full."
    example = "Queue.bounded[IO, Event](1024)" }
  { name = unbounded, owner = Queue, result = "F[Queue[F, A]]", rank = 50, insert = "unbounded[|]"
    doc = "A queue without a size limit (memory grows if consumers fall behind)." }
  { name = dropping, owner = Queue, params = ["Int"], result = "F[Queue[F, A]]", rank = 30, insert = "dropping[|]()"
    doc = "A bounded queue that drops new elements when full." }
  { name = circularBuffer, owner = Queue, params = ["Int"], result = "F[Queue[F, A]]", rank = 30, insert = "circularBuffer[|]()"
    doc = "A bounded queue that evicts the oldest element when full." }
  { name = synchronous, owner = Queue, result = "F[Queue[F, A]]", rank = 20, insert = "synchronous[|]"
    doc = "A rendezvous queue: offer waits for a taker." }
  { name = offer, owner = Queue, kind = method, receiver = "Queue[F, A]", params = ["A"], result = "F[Unit]", rank = 70
    doc = "Enqueue, waiting if the queue is full (bounded)." }
  { name = take, owner = Queue, kind = method, receiver = "Queue[F, A]", result = "F[A]", rank = 70, insert = "take"
    doc = "Dequeue, waiting until an element is available." }
  { name = tryOffer, owner = Queue, kind = method, receiver = "Queue[F, A]", params = ["A"], result = "F[Boolean]", rank = 40
    doc = "Enqueue if there is room, without waiting." }
  { name = tryTake, owner = Queue, kind = method, receiver = "Queue[F, A]", result = "F[Option[A]]", rank = 40, insert = "tryTake"
    doc = "Dequeue if an element is available, without waiting." }
  { name = tryTakeN, owner = Queue, kind = method, receiver = "Queue[F, A]", params = ["Option[Int]"], result = "F[List[A]]", rank = 20
    doc = "Drain up to n (or all) available elements without waiting." }
  { name = size, owner = Queue, kind = method, receiver = "Queue[F, A]", result = "F[Int]", rank = 20, insert = "size"
    doc = "Current number of elements." }

  # ---------------------------------------------------------------- Semaphore
  { name = apply, owner = Semaphore, params = ["Long"], result = "F[Semaphore[F]]", rank = 40, insert = "apply[|]()"
    doc = "A semaphore with n permits."
    example = "Semaphore[IO](4)" }
  { name = permit, owner = Semaphore, kind = method, receiver = "Semaphore[F]", result = "Resource[F, Unit]", rank = 70, insert = "permit"
    doc = "Hold a permit for the scope of a Resource: the safe way to limit concurrency."
    example = "sem.permit.surround(callApi)" }
  { name = acquire, owner = Semaphore, kind = method, receiver = "Semaphore[F]", result = "F[Unit]", rank = 30, insert = "acquire"
    doc = "Take a permit, waiting if none is available. Pair with release, or prefer permit." }
  { name = release, owner = Semaphore, kind = method, receiver = "Semaphore[F]", result = "F[Unit]", rank = 30, insert = "release"
    doc = "Give a permit back." }
  { name = tryAcquire, owner = Semaphore, kind = method, receiver = "Semaphore[F]", result = "F[Boolean]", rank = 20, insert = "tryAcquire"
    doc = "Take a permit if one is available, without waiting." }
  { name = acquireN, owner = Semaphore, kind = method, receiver = "Semaphore[F]", params = ["Long"], result = "F[Unit]", rank = 15
    doc = "Take n permits." }
  { name = available, owner = Semaphore, kind = method, receiver = "Semaphore[F]", result = "F[Long]", rank = 15, insert = "available"
    doc = "Number of free permits." }

  # ---------------------------------------------------------------- Supervisor / Dispatcher
  { name = apply, owner = Supervisor, result = "Resource[F, Supervisor[F]]", rank = 40, insert = "apply[|]"
    doc = "A scope for fire-and-forget fibers: they are cancelled when the Resource is released." }
  { name = supervise, owner = Supervisor, kind = method, receiver = "Supervisor[F]", params = ["F[A]"], result = "F[Fiber[F, Throwable, A]]"
    rank = 60
    doc = "Start a fiber owned by this supervisor." }
  { name = parallel, owner = Dispatcher, result = "Resource[F, Dispatcher[F]]", rank = 50, insert = "parallel[|]"
    doc = "Run effects from impure code (callbacks, Java APIs), in parallel." }
  { name = sequential, owner = Dispatcher, result = "Resource[F, Dispatcher[F]]", rank = 35, insert = "sequential[|]"
    doc = "Run effects from impure code, one at a time in submission order." }
  { name = unsafeRunAndForget, owner = Dispatcher, kind = method, receiver = "Dispatcher[F]", params = ["F[A]"], result = "Unit", rank = 50
    doc = "Submit an effect from impure code and do not wait." }
  { name = unsafeToFuture, owner = Dispatcher, kind = method, receiver = "Dispatcher[F]", params = ["F[A]"], result = "Future[A]", rank = 50
    doc = "Submit an effect from impure code and get a Future." }
  { name = unsafeRunSync, owner = Dispatcher, kind = method, receiver = "Dispatcher[F]", params = ["F[A]"], result = "A", rank = 20
    doc = "Submit and block the calling thread. Never call from inside F." }

  # ---------------------------------------------------------------- Random / Console / UUIDGen
  { name = scalaUtilRandom, owner = Random, result = "F[Random[F]]", rank = 50, insert = "scalaUtilRandom[|]"
    doc = "A Random backed by scala.util.Random." }
  { name = javaUtilConcurrentThreadLocalRandom, owner = Random, result = "Random[F]", rank = 20
    insert = "javaUtilConcurrentThreadLocalRandom[|]"
    doc = "A Random backed by ThreadLocalRandom (no allocation)." }
  { name = nextInt, owner = Random, kind = method, receiver = "Random[F]", result = "F[Int]", rank = 50, insert = "nextInt"
    doc = "A random Int." }
  { name = nextIntBounded, owner = Random, kind = method, receiver = "Random[F]", params = ["Int"], result = "F[Int]", rank = 30
    doc = "A random Int in [0, n)." }
  { name = betweenInt, owner = Random, kind = method, receiver = "Random[F]", params = ["Int", "Int"], result = "F[Int]", rank = 40
    insert = "betweenInt(|, )"
    doc = "A random Int in [min, max)." }
  { name = nextDouble, owner = Random, kind = method, receiver = "Random[F]", result = "F[Double]", rank = 30, insert = "nextDouble"
    doc = "A random Double in [0, 1)." }
  { name = shuffleList, owner = Random, kind = method, receiver = "Random[F]", params = ["List[A]"], result = "F[List[A]]", rank = 30
    doc = "A random permutation." }
  { name = elementOf, owner = Random, kind = method, receiver = "Random[F]", params = ["Iterable[A]"], result = "F[A]", rank = 30
    doc = "A random element (fails on an empty collection)." }
  { name = nextAlphaNumeric, owner = Random, kind = method, receiver = "Random[F]", result = "F[Char]", rank = 20, insert = "nextAlphaNumeric"
    doc = "A random [a-zA-Z0-9] character." }
  { name = println, owner = Console, params = ["A"], result = "F[Unit]", rank = 60
    doc = "Console[F].println: print a line (uses Show[A] when available)." }
  { name = print, owner = Console, params = ["A"], result = "F[Unit]", rank = 30
    doc = "Console[F].print: print without a newline." }
  { name = errorln, owner = Console, params = ["A"], result = "F[Unit]", rank = 30
    doc = "Console[F].errorln: print a line to stderr." }
  { name = readLine, owner = Console, result = "F[String]", rank = 40, insert = "readLine"
    doc = "Console[F].readLine: read a line from stdin." }
  { name = randomUUID, owner = UUIDGen, result = "F[UUID]", rank = 40, insert = "randomUUID"
    doc = "UUIDGen[F].randomUUID: a random UUID as an effect (testable, unlike UUID.randomUUID)." }

  # ---------------------------------------------------------------- latches, Mutex, AtomicCell, Hotswap
  { name = apply, owner = CountDownLatch, params = ["Int"], result = "F[CountDownLatch[F]]", rank = 30, insert = "apply[|]()"
    doc = "A latch that opens after n releases." }
  { name = await, owner = CountDownLatch, kind = method, receiver = "CountDownLatch[F]", result = "F[Unit]", rank = 40, insert = "await"
    doc = "Wait until the latch opens." }
  { name = release, owner = CountDownLatch, kind = method, receiver = "CountDownLatch[F]", result = "F[Unit]", rank = 40, insert = "release"
    doc = "Count down by one." }
  { name = apply, owner = Mutex, result = "F[Mutex[F]]", rank = 30, insert = "apply[|]"
    doc = "A mutual-exclusion lock." }
  { name = lock, owner = Mutex, kind = method, receiver = "Mutex[F]", result = "Resource[F, Unit]", rank = 50, insert = "lock"
    doc = "Hold the lock for the scope of a Resource."
    example = "mutex.lock.surround(critical)" }
  { name = evalUpdate, owner = AtomicCell, kind = method, receiver = "AtomicCell[F, A]", params = ["A => F[A]"], result = "F[Unit]", rank = 50
    doc = "Update with an effect, serialised (unlike Ref, the effect runs while holding the cell)." }
  { name = evalModify, owner = AtomicCell, kind = method, receiver = "AtomicCell[F, A]", params = ["A => F[(A, B)]"], result = "F[B]", rank = 40
    doc = "Modify with an effect and return a result." }
  { name = get, owner = AtomicCell, kind = method, receiver = "AtomicCell[F, A]", result = "F[A]", rank = 40, insert = "get"
    doc = "Read the current value." }
  { name = update, owner = AtomicCell, kind = method, receiver = "AtomicCell[F, A]", params = ["A => A"], result = "F[Unit]", rank = 35
    doc = "Update with a pure function." }
  { name = create, owner = Hotswap, result = "Resource[F, Hotswap[F, R]]", rank = 30, insert = "create[|]"
    doc = "A slot holding a swappable resource (log files, connections)." }
  { name = swap, owner = Hotswap, kind = method, receiver = "Hotswap[F, R]", params = ["Resource[F, R]"], result = "F[R]", rank = 40
    doc = "Acquire the new resource, then release the old one." }
  { name = clear, owner = Hotswap, kind = method, receiver = "Hotswap[F, R]", result = "F[Unit]", rank = 20, insert = "clear"
    doc = "Release the current resource and leave the slot empty." }
]
