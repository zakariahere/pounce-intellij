# Extension methods on tuples of effects: (F[A], F[B], ...). Written for pairs; widened to any arity at runtime.
library = cats-core
kind = tuple
syntax = apply

ops = [
  { name = mapN, owner = Apply, receiver = "(F[A], F[B])", params = ["(A, B) => C"], result = "F[C]"
    requires { F = Apply }, rank = 95, insert = "mapN(|)"
    doc = "Combine independent effects with a function. Fails fast for Either/IO; accumulates for Validated."
    example = "(validateName(n), validateAge(a)).mapN(User.apply)"
    see-also = [tupled, parMapN] }
  { name = tupled, owner = Semigroupal, receiver = "(F[A], F[B])", result = "F[(A, B)]"
    requires { F = Semigroupal }, rank = 85, insert = "tupled"
    doc = "Combine independent effects into one effect of a tuple."
    example = "(fetchUser(id), fetchOrders(id)).tupled   // IO[(User, List[Order])]"
    see-also = [mapN, parTupled] }
  { name = flatMapN, owner = FlatMap, receiver = "(F[A], F[B])", params = ["(A, B) => F[C]"], result = "F[C]"
    requires { F = FlatMap }, rank = 45, insert = "flatMapN(|)"
    doc = "mapN with an effectful function, flattened." }
  { name = parMapN, owner = Parallel, syntax = parallel, receiver = "(F[A], F[B])", params = ["(A, B) => C"], result = "F[C]"
    requires { F = Parallel }, rank = 80, insert = "parMapN(|)"
    doc = "mapN, running the effects in parallel (or accumulating errors for Either via Parallel)."
    example = "(fetchProfile(id), fetchAvatar(id)).parMapN(Page.apply)" }
  { name = parTupled, owner = Parallel, syntax = parallel, receiver = "(F[A], F[B])", result = "F[(A, B)]"
    requires { F = Parallel }, rank = 70, insert = "parTupled"
    doc = "tupled, running the effects in parallel." }
  { name = parFlatMapN, owner = Parallel, syntax = parallel, receiver = "(F[A], F[B])", params = ["(A, B) => F[C]"], result = "F[C]"
    requires { F = Parallel }, rank = 30, insert = "parFlatMapN(|)"
    doc = "flatMapN, running the effects in parallel." }
  { name = traverseN, owner = Traverse, receiver = "(F[A], F[B])", params = ["(A, B) => G[C]"], result = "G[F[C]]"
    requires { F = Traverse, G = Applicative }, rank = 30, insert = "traverseN(|)"
    doc = "mapN with an effectful function, the effects collected: like traverse over the combined structure." }
]
