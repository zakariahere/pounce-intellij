# Typeclass summoner members: `Applicative[F].unit`, `MonadThrow[F].raiseError(e)`, `ApplicativeError[F, E].fromEither`.
# Completion shows these for `Sync[F].`, `Async[F].`, an implicit `F: Monad[F]` parameter, ... (everything the summoned
# typeclass implies). Variant `summoner` keeps the ids apart from the syntax / lift ops of the same name.
library = cats-core
kind = companion

ops = [
  { name = pure, owner = Applicative, variant = summoner, params = ["A"], result = "F[A]", rank = 70
    doc = "Lift an already computed value into F."
    example = "Applicative[F].pure(user)" }
  { name = unit, owner = Applicative, variant = summoner, result = "F[Unit]", rank = 65, insert = "unit"
    doc = "An effect that does nothing. Preferred over pure(())." }
  { name = whenA, owner = Applicative, variant = summoner, params = ["Boolean", "F[A]"], result = "F[Unit]", rank = 40, insert = "whenA(|)()"
    doc = "Run the effect only when the condition holds." }
  { name = unlessA, owner = Applicative, variant = summoner, params = ["Boolean", "F[A]"], result = "F[Unit]", rank = 35, insert = "unlessA(|)()"
    doc = "Run the effect unless the condition holds." }
  { name = replicateA, owner = Applicative, variant = summoner, params = ["Int", "F[A]"], result = "F[List[A]]", rank = 20, insert = "replicateA(|, )"
    doc = "Run the effect n times, collecting the results." }
  { name = raiseError, owner = ApplicativeError, variant = summoner, params = ["E"], result = "F[A]", rank = 70
    doc = "A failed F."
    example = "MonadThrow[F].raiseError(new NotFound(id))" }
  { name = fromEither, owner = ApplicativeError, variant = summoner, params = ["Either[E, A]"], result = "F[A]", rank = 55
    doc = "Lift an Either: Right becomes the value, Left is raised." }
  { name = fromOption, owner = ApplicativeError, variant = summoner, params = ["Option[A]", "E"], result = "F[A]", rank = 50, insert = "fromOption(|, )"
    doc = "Lift an Option, raising the given error for None." }
  { name = fromTry, owner = ApplicativeError, variant = summoner, params = ["Try[A]"], result = "F[A]", rank = 35
    doc = "Lift a Try (needs E to be Throwable)." }
  { name = catchNonFatal, owner = ApplicativeError, variant = summoner, params = ["A"], result = "F[A]", rank = 35
    doc = "Evaluate now, catching non-fatal exceptions into the error channel. Not for side effects: use Sync[F].delay." }
  { name = raiseWhen, owner = ApplicativeError, variant = summoner, params = ["Boolean", "E"], result = "F[Unit]", rank = 30, insert = "raiseWhen(|)()"
    doc = "Raise the error when the condition holds, otherwise unit." }
  { name = raiseUnless, owner = ApplicativeError, variant = summoner, params = ["Boolean", "E"], result = "F[Unit]", rank = 30, insert = "raiseUnless(|)()"
    doc = "Raise the error unless the condition holds." }
  { name = attempt, owner = ApplicativeError, variant = summoner, params = ["F[A]"], result = "F[Either[E, A]]", rank = 30
    doc = "Materialise the errors of an effect into an Either." }
  { name = handleErrorWith, owner = ApplicativeError, variant = summoner, params = ["F[A]", "E => F[A]"], result = "F[A]", rank = 30, insert = "handleErrorWith(|)()"
    doc = "Recover from any error with another effect." }
  { name = rethrow, owner = MonadError, variant = summoner, params = ["F[Either[E, A]]"], result = "F[A]", rank = 30
    doc = "Raise the Left of an F[Either[E, A]]." }
  { name = tailRecM, owner = Monad, variant = summoner, params = ["A", "A => F[Either[A, B]]"], result = "F[B]", rank = 20, insert = "tailRecM(|)()"
    doc = "Stack-safe monadic loop: Left continues with a new state, Right stops with the result." }
  { name = ifM, owner = Monad, variant = summoner, params = ["F[Boolean]", "F[B]", "F[B]"], result = "F[B]", rank = 25, insert = "ifM(|)(, )"
    doc = "Branch on an effectful condition." }
]
