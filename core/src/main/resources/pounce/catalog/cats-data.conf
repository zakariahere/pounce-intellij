# cats.data: monad transformers and non-empty collections (mostly companion constructors).
library = cats-core
kind = companion

ops = [
  { name = liftF, owner = EitherT, params = ["F[A]"], result = "EitherT[F, E, A]", rank = 80
    doc = "Lift an effect into EitherT as a success."
    example = "EitherT.liftF(repo.find(id))" }
  { name = fromEither, owner = EitherT, params = ["Either[E, A]"], result = "EitherT[F, E, A]", rank = 70, insert = "fromEither[|]()"
    doc = "Lift a pure Either into EitherT."
    example = "EitherT.fromEither[IO](validate(req))" }
  { name = fromOption, owner = EitherT, params = ["Option[A]", "E"], result = "EitherT[F, E, A]", rank = 60, insert = "fromOption[|]()"
    doc = "Lift an Option into EitherT, with an error for None." }
  { name = fromOptionF, owner = EitherT, params = ["F[Option[A]]", "E"], result = "EitherT[F, E, A]", rank = 60, insert = "fromOptionF(|)"
    doc = "Lift an F[Option] into EitherT, with an error for None."
    example = "EitherT.fromOptionF(repo.find(id), UserNotFound(id))" }
  { name = rightT, owner = EitherT, params = ["A"], result = "EitherT[F, E, A]", rank = 60, insert = "rightT[|]()"
    doc = "A successful EitherT from a pure value." }
  { name = leftT, owner = EitherT, params = ["E"], result = "EitherT[F, E, A]", rank = 60, insert = "leftT[|]()"
    doc = "A failed EitherT from a pure error." }
  { name = cond, owner = EitherT, params = ["Boolean", "A", "E"], result = "EitherT[F, E, A]", rank = 40, insert = "cond[|]()"
    doc = "Right(a) if the condition holds, Left(e) otherwise." }
  { name = liftF, owner = OptionT, params = ["F[A]"], result = "OptionT[F, A]", rank = 70
    doc = "Lift an effect into OptionT as Some." }
  { name = fromOption, owner = OptionT, params = ["Option[A]"], result = "OptionT[F, A]", rank = 60, insert = "fromOption[|]()"
    doc = "Lift a pure Option into OptionT." }
  { name = some, owner = OptionT, params = ["A"], result = "OptionT[F, A]", rank = 50, insert = "some[|]()"
    doc = "OptionT of Some(a)." }
  { name = none, owner = OptionT, result = "OptionT[F, A]", rank = 50, insert = "none[|]"
    doc = "OptionT of None." }
  { name = whenF, owner = OptionT, params = ["Boolean", "F[A]"], result = "OptionT[F, A]", rank = 30, insert = "whenF(|)()"
    doc = "Some(effect result) when the condition holds." }
  { name = one, owner = NonEmptyList, params = ["A"], result = "NonEmptyList[A]", rank = 60
    doc = "A NonEmptyList with a single element." }
  { name = of, owner = NonEmptyList, params = ["A", "A"], result = "NonEmptyList[A]", rank = 55
    doc = "A NonEmptyList from at least one element." }
  { name = fromList, owner = NonEmptyList, params = ["List[A]"], result = "Option[NonEmptyList[A]]", rank = 55
    doc = "Some(nel) for a non-empty list, None for an empty one." }
  { name = ask, owner = Kleisli, result = "Kleisli[F, A, A]", rank = 40, insert = "ask[|]"
    doc = "A Kleisli that returns its environment." }
  { name = liftF, owner = Kleisli, params = ["F[B]"], result = "Kleisli[F, A, B]", rank = 40
    doc = "Lift an effect into Kleisli, ignoring the environment." }

  # ---------------------------------------------------------------- transformer methods
  { name = value, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", result = "F[Either[E, A]]", rank = 70, insert = "value"
    doc = "Unwrap the transformer." }
  { name = semiflatMap, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", params = ["A => F[B]"], result = "EitherT[F, E, B]", rank = 55
    doc = "flatMap with an effect that cannot fail (F[B] instead of EitherT)." }
  { name = subflatMap, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", params = ["A => Either[E, B]"], result = "EitherT[F, E, B]", rank = 50
    doc = "flatMap with a pure Either." }
  { name = leftSemiflatMap, owner = EitherT, kind = method, receiver = "EitherT[F, E, A]", params = ["E => F[C]"], result = "EitherT[F, C, A]", rank = 30
    doc = "Effectfully transform the error." }
  { name = value, owner = OptionT, kind = method, receiver = "OptionT[F, A]", result = "F[Option[A]]", rank = 70, insert = "value"
    doc = "Unwrap the transformer." }
  { name = getOrElseF, owner = OptionT, kind = method, receiver = "OptionT[F, A]", params = ["F[A]"], result = "F[A]", rank = 55
    doc = "The value, or run the fallback effect." }
  { name = toRight, owner = OptionT, kind = method, receiver = "OptionT[F, A]", params = ["E"], result = "EitherT[F, E, A]", rank = 45
    doc = "Convert to EitherT with an error for None." }
]
