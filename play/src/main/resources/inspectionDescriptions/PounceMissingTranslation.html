Reports an i18n message key that is defined in the default <code>conf/messages</code> but missing from one of the
project's <code>conf/messages.&lt;lang&gt;</code> files, so users of that language see the default text.
<p>The quick fix appends the key (with the default text as a starting point) to the language file.</p>
